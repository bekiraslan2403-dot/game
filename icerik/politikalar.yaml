# Politika dosyası: kademeli ayarlar (Uygulama planı · Kapsam genişlemesi).
# yol: kararname → hemen yürürlüğe girer; kanun → ay sonunda Meclis'te oylanır.
# adim: bir kademe YUKARI çıkıldığında olan etki; aşağı inilince işaretleri tersine döner.
#   etki anahtarları kartlardakiyle aynı göstergelerdir; butce_acigi etkisi "kalem" alanındaki bütçe kalemine yazılır.
# sesler: kademe yükselince (artis) ve düşünce (azalis) vatandaşların söyledikleri.

# ---------------------------------------------------------------- Ekonomi ve çalışma hayatı
- id: emekli_aylik
  ad: Emekli aylığı ve ikramiye
  bolum: ekonomi
  yol: kanun
  getiren: calisma
  aciklama: "En düşük emekli aylığı ve bayram ikramiyesi tutarları kanunla belirlenir."
  kademeler: ["Aylık pahalılık karşısında eriyor", "Küçük zam, alım gücü düşüyor", "Zam fiyat artışı kadar", "Zam fiyatların biraz önünde", "Yüksek zam ve ikramiye artışı"]
  baslangic: 2
  kalem: emekli
  adim: { grup.emekli: 3, enflasyon: 0.2, butce_acigi: 0.3 }
  sesler:
    artis: ["Torunuma harçlık verebileceğim artık.", "Kırk yıl çalıştık, bunu hak ettik."]
    azalis: ["Emekliye yine sıra gelmedi.", "İlaç parasını bile çıkaramıyoruz."]

- id: memur_maas
  ad: Memur maaş artışı
  bolum: ekonomi
  yol: kararname
  getiren: hazine
  aciklama: "Toplu sözleşme ve enflasyon farkıyla belirlenen kamu görevlisi aylıkları."
  kademeler: ["Zam fiyatların çok gerisinde", "Zam fiyatların gerisinde", "Zam fiyat artışı kadar", "Zam fiyatların biraz önünde", "Cebe giren para belirgin artıyor"]
  baslangic: 2
  kalem: personel
  adim: { grup.memur: 3.5, kamu_hizmet: 0.8, enflasyon: 0.15, butce_acigi: 0.25 }
  sesler:
    artis: ["Kira artışını ancak böyle karşılarız.", "Hekimler belki gitmekten vazgeçer."]
    azalis: ["Memur yine enflasyona ezildi.", "Sendika toplu sözleşmeyi masada bıraktı."]

- id: tarim_destek
  ad: Tarım destekleri
  bolum: ekonomi
  yol: kararname
  getiren: tarim
  aciklama: "Mazot, gübre ve ürün başına doğrudan ödemeler."
  kademeler: ["Asgari", "Düşük", "Mevcut seviye", "Yüksek", "Çok yüksek"]
  baslangic: 2
  kalem: sosyal
  adim: { grup.esnaf: 2.5, enflasyon: -0.15, butce_acigi: 0.12 }
  sesler:
    artis: ["Bu yıl tarlayı ekmeye değecek.", "Mazot desteği geldi, traktör çalışır."]
    azalis: ["Tarlayı kiraya verip şehre göçeceğiz.", "Gübre altın fiyatına çıktı, destek kesildi."]

- id: kira_siniri
  ad: Kira artış sınırı
  bolum: ekonomi
  yol: kanun
  temel_hak: true
  getiren: cevre
  aciklama: "Konut kira artışları kanunla 12 aylık enflasyon ortalamasına bağlanabilir ya da serbest bırakılabilir."
  kademeler: ["Sınır yok", "Gevşek sınır", "12 aylık enflasyon ortalaması", "Sıkı tavan", "Kira dondurma"]
  baslangic: 2
  adim: { grup.kiraci: 2.5, grup.kentli: 0.5, grup.esnaf: -0.8, konut: 0.8, guven: -1 }
  sesler:
    artis: ["Ev sahibi her yıl yüzde 80 istiyordu, nefes aldık.", "Kiracı da insan, sonunda biri duydu."]
    azalis: ["Kontratı yenilerken kira ikiye katlandı.", "Kiralık ev ilanları bir gecede pahalandı."]

- id: kentsel_donusum
  ad: Kentsel dönüşüm ve güçlendirme
  bolum: ekonomi
  yol: kararname
  getiren: cevre
  aciklama: "Riskli yapıların yenilenmesi ve güçlendirilmesi için ayrılan kamu kaynağı."
  kademeler: ["Durdurulmuş", "Düşük", "Mevcut program", "Hızlandırılmış", "Seferberlik"]
  baslangic: 2
  kalem: yatirim
  adim: { deprem: 3, konut: 1, buyume: 0.15, issizlik: -0.1, grup.kentli: 0.5, grup.kiraci: -0.5, butce_acigi: 0.25 }
  sesler:
    artis: ["Çürük binada uyumaktan kurtulacağız.", "Şantiyeler açıldı, usta bulunmuyor."]
    azalis: ["Deprem kapıda, program durduruldu.", "Binamız riskli raporlu ama sıra bize hiç gelmiyor."]

- id: arge
  ad: Ar-Ge ve bilim destekleri
  bolum: ekonomi
  yol: kararname
  getiren: sanayi
  aciklama: "Araştırma projeleri, burslar, teknoparklar ve şirket Ar-Ge teşvikleri."
  kademeler: ["Asgari", "Düşük", "Orta", "Yüksek", "Çok yüksek"]
  baslangic: 2
  kalem: yatirim
  adim: { buyume: 0.1, grup.is_dunyasi: 1, grup.genc: 0.8, itibar: 0.5, butce_acigi: 0.1 }
  sesler:
    artis: ["Laboratuvar için ilk kez yeni cihaz aldık.", "Doktoradan sonra burada kalmayı düşünüyorum."]
    azalis: ["Proje fonu kesildi, ekip dağıldı.", "Araştırmacılar yine yurt dışına bakıyor."]

# ---------------------------------------------------------------- Toplum, güvenlik, hukuk
