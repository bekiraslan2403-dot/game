# Olay zincirleri: tohum kartı masaya rastgele gelir; sonraki aşamalar yalnız seçeneklerin "sonraki" alanıyla gelir.
# Zincir kartları tohumun değişkenlerini (ör. {il}) devralır.

# ---- Zincir 1: Belediye borcu
- id: belediye_maas_1
  kategori: yerel
  zincir: belediye_borcu
  asama: tohum
  kosul:
    ay_en_cok: 16
  getiren: ozel_kalem
  degiskenler:
    il: muhalif_sehir
  metin:
    baslik: "{il} garajında son vardiya"
    durum: Nermin, belediye garajından canlı bağlantı açıyor. Şoförler sabah sefere çıkmayacaklarını söylüyor; iki
      aylık ücret alacakları var. Belediye başkanı kesilen Hazine payını gösteriyor. Hazine aynı dosyada
      personel dışı ödemeler de bulunduğunu belirtiyor. Sendika önce bordronun ayrılmasını istiyor.
  secenekler:
    - metin: Bordroyu ayır; ücret ödeneğini doğrudan çıkar
      etki: {}
      icra:
        imza: true
        maas: true
        odeme:
          metin: "{il} belediyesi ücret ödeneği"
          kalem: personel
          maliyet: 0.0012
          vade: 1
          tek_seferlik: true
      bayrak:
        belediye_ucret_odendi: true
      sonraki:
        - kart: belediye_maas_2a
          gecikme: 1
      haber: "{il} için ücret ödeneği çıkarıldı; personel dışı belediye borçları bu ödemenin dışında bırakıldı."
    - metin: Kaynak verme; belediyeden ödeme planı iste
      etki:
        grup.isci: -2
        kutuplasma: 1
        grup.kentli: -1
      bayrak:
        belediye_ucret_odendi: false
      sonraki:
        - kart: belediye_maas_2b
          gecikme: 1
      haber: "{il} için ek kaynak çıkarılmadı; belediyeden ödeme planı istendi."
    - metin: Belediye ve sendikayla hesapları yerinde incelet
      etki: {}
      icra:
        gun: 1
      bayrak:
        belediye_inceleme: true
      sonraki:
        - kart: belediye_maas_2c
          gecikme: 1
      haber: "{il} belediyesinin hesapları sendikayla birlikte incelemeye alındı; ücret ödemesi henüz yapılmadı."
  anlati:
    mekan: Cumhurbaşkanlığı · {il} bağlantısı
    amac: Sabah seferini ve ücret alacağını çöz; belediyenin diğer borçlarını bu ödemeden ayır.
    sesler:
      - kim: sendika
        metin: Grev kararı imzalandı. Hastaneye giden hattı çalıştırmamızı istiyorlar; şoförün kendi evinde kira
          bekliyor. Belediyenin bütün borcuna kefil olmam. Ücret listesini ayrı konuşalım.
      - kim: hazine
        metin: Kesinti yazısı gerçek. Fakat belediyenin gösterdiği açığın tamamı ücret değil. Siyasi tartışmayı bordro
          hesabından ayırmadan ödeme yapmayalım.
    belgeler:
      - ad: Bordro ve kesinti yazısı
        metin: Personel listesi, sendikanın iki aylık alacak listesiyle uyuşuyor. Belediye aynı talebe reklam ve araç
          kiralama faturalarını da eklemiş. Hazine’nin itirazı ücretlerin varlığına değil toplam talebin
          kapsamına.
    secenekNotlari:
      - gerekce: ""
        bedel: Bütçe ve imza gerekir. Yalnız bu ücret dönemi ödenir.
      - gerekce: ""
        bedel: Alacak çözülmez; hizmet kesintisi sürer.
      - gerekce: ""
        bedel: İnceleme ücret ödemez. İşçiler beklerken gerilim artabilir.
- id: belediye_maas_2a
  kategori: yerel
  tur: zincir
  zincir: belediye_borcu
  asama: gelisme
  getiren: hazine
  degiskenler:
    il: muhalif_sehir
  metin:
    baslik: "{il}: Ödenen ücret, açık kalan hesap"
    durum: Ücret ödeneği çıktı. Sendika yeni ayın maaşını soruyor; belediye başkanı ödemenin bütün borcu
      kapatmadığını söylüyor. Diğer belediyeler aynı koşullarla başvurmak istiyor. Hazine yeni ödeneğin tekrar
      karar gerektirdiğini hatırlatıyor.
  secenekler:
    - metin: Yalnız yeni ayın ücretini finanse et
      etki: {}
      icra:
        imza: true
        maas: true
        odeme:
          metin: "{il} belediyesi yeni ay ücret ödeneği"
          kalem: personel
          maliyet: 0.0006
          vade: 1
          tek_seferlik: true
      bayrak:
        belediye_ikinci_odeme: true
        belediye_ikinci_yol: odeme
      haber: "{il} için yeni ay ücret ödeneği çıktı. Geçen ayın ödemesi ikinci kez yapılmadı."
      sonraki:
        - kart: belediye_maas_hizmet
          gecikme: 1
    - metin: Hesapları yayımla; yeni ödenek vermeden masayı sürdür
      etki:
        grup.isci: -1
        guven: 0.5
      icra:
        gun: 1
      bayrak:
        belediye_acik_hesap: true
        belediye_ikinci_yol: hesap
      sonraki:
        - kart: belediye_maas_hesap
          gecikme: 1
      haber: "{il} bordrosu ve belediyenin diğer faturaları ayrı ayrı yayımlandı. Yeni ücret ödenmedi."
    - metin: İtirazı güvenlik müdahalesiyle bastır
      etki:
        grup.isci: -3
        kutuplasma: 3
      sicil:
        tur: baski
        kaynak: Belediye ücret itirazına güvenlik müdahalesi
      sonraki:
        - kart: belediye_maas_3
          gecikme: 1
      bayrak:
        belediye_ikinci_yol: muda
      haber: "{il} garajındaki ücret eylemine müdahale edildi. Ödenmemiş bordro bu kararla kapanmadı."
  anlati:
    mekan: Cumhurbaşkanlığı · {il} bağlantısı
    amac: Önceki kararın ardından kalan ücret alacağını ve yeni dönemin kaynağını karara bağla.
    sesler:
      - kim: sendika
        metin: Geçen iki ayın ücretleri yattı, garaj çalışıyor. Başkan “merkez artık maaşı üstlendi” demiş. Bizim
          imzaladığımız listede böyle bir söz yok. Bu ayın kaynağını kim bulacak?
      - kim: hazine
        metin: Her yeni ücret dönemi ayrı ödenektir. Başka belediyelere verilecek destek aynı dosyadan otomatik
          doğmaz.
    belgeler:
      - ad: Banka teyidi
        metin: Önceki ödeneğin personele dağıtıldığı doğrulanmış. Yeni ayın bordrosu ayrı. Belediye başkanının
          açıklamasının aksine, Hazine kararı kalıcı ücret üstlenimi içermiyor.
    secenekNotlari:
      - gerekce: ""
        bedel: Bu dönem için gerçek ödeme çıkar; yapısal borç sorunu sürer.
      - gerekce: ""
        bedel: Hesap görünür olur; ödeme bekleyenler bu sonuçla yetinmeyebilir.
      - gerekce: ""
        bedel: Alacak bitmez. Müdahale sicile geçer ve başkanın kampanyasını büyütebilir.
