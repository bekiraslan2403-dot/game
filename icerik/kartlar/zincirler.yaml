- id: belediye_maas_3
  tur: zincir
  kategori: yerel
  zincir: belediye_borcu
  asama: sonuc
  getiren: belediye
  degiskenler:
    il: muhalif_sehir
  metin:
    baslik: "{il} garajından sonra"
    durum: Garajdaki ücret eylemine güvenlik müdahalesi yapıldı. Sendika müdahale tutanağıyla ödenmemiş bordroyu
      aynı masaya koyuyor. Hastane hattındaki sefer açığı sürüyor; belediye başkanı merkezin müdahalesini
      açıkça eleştiriyor.
  secenekler:
    - metin: Müdahaleyi bitir; sendikayla görüşme aç
      etki:
        grup.isci: 1
        kutuplasma: -1
        parti_ici: 1
      bayrak:
        belediye_sonuc: muzakere
      haber: "{il} garajında müdahale durduruldu. Görüşme başladı; ücret için henüz yeni ödeme kararı yok."
      icra:
        gun: 1
    - metin: Hastane hattı için geçici taşıma satın al
      etki:
        kamu_hizmet: 0.4
        grup.isci: -1
      bayrak:
        belediye_sonuc: guvenli_hat
      haber: "{il} hastane hattına ayrı taşıma sağlandı. Garaj işçilerinin alacağı ve müdahale kaydı açık kaldı."
      icra:
        gun: 1
        odeme:
          metin: "{il} hastane hattı için bir dönemlik geçici taşıma"
          kalem: yatirim
          maliyet: 0.0003
          vade: 1
          tek_seferlik: true
    - metin: Müdahaleyi sürdür; ücret talebini reddet
      etki:
        grup.isci: -3
        kutuplasma: 2
        basin: -1
      bayrak:
        belediye_sonuc: baski_surdu
      haber: "{il} garajında müdahale sürdü; ücret alacağı ödenmedi."
      sicil:
        tur: baski
        kaynak: Belediye garajındaki ücret eylemine süren müdahale
  anlati:
    mekan: "{il} garajı · müdahale sonrası"
    amac: Müdahalenin yarattığı durumu ve hastane seferini ücret alacağından ayrı karara bağla.
    sesler:
      - kim: sendika
        metin: Müdahale tutanağını yanımda getirdim. Şoförlerin hesabına yatan parayı da gösterebilir misiniz?
      - kim: ozel_kalem
        metin: Hastane hattı için ayrı araç alınabilir. Bu, belediye işçilerinin bordrosunu ödemez.
    belgeler:
      - ad: Üç ayrı kayıt
        metin: Güvenlik müdahalesi, açık ücret bordrosu ve aksayan sefer ayrı kayıtlarda. Bu dosyada bir mahkeme hükmü
          yok.
    secenekNotlari:
      - gerekce: Görüşme açarsın.
        bedel: Ücret ödemesi çıkmadıkça seferin tümü geri dönmeyebilir.
      - gerekce: Acil hattı geçici taşıyıcıyla açarsın.
        bedel: Bütçe yükü doğar; önceki müdahale ve alacak sürer.
      - gerekce: Güvenlik çizgisini korursun.
        bedel: Baskı sicili büyür; ücret ve hizmet açığı kapanmaz.
- id: belediye_maas_hizmet
  tur: zincir
  kategori: yerel
  zincir: belediye_borcu
  asama: sonuc
  getiren: sendika
  degiskenler:
    il: muhalif_sehir
  metin:
    baslik: "{il} garajında banka fişi"
    durum: Hazine önceki karara göre ücret ödeneği çıkardı. Sendika, bordroyla banka kayıtlarını yan yana koyuyor.
      Belediyenin reklam ve araç kiralama faturaları bu ödemeye girmedi. Gelecek ayın ulaşım çizelgesini kimin
      üstleneceği hâlâ açık.
  secenekler:
    - metin: Sendikayla denetlenebilir sefer çizelgesi çıkar
      etki:
        grup.isci: 1.5
        grup.esnaf: 0.5
        kamu_hizmet: 0.3
      bayrak:
        belediye_sonuc: cizelge
      haber: "{il} sendikası ve belediye yeni sefer çizelgesini birlikte ilan etti; gelecekteki ücretler belediyenin
        sorumluluğunda."
      icra:
        gun: 1
    - metin: Personel dışı giderleri belediye denetimine aç
      etki:
        grup.kentli: 1
        parti_ici: 1
        guven: 0.3
      bayrak:
        belediye_sonuc: denetim
      haber: "{il} personel dışı faturaları incelemeye açıldı; ücret ödeneği yeni borçları üstlenmedi."
      icra:
        gun: 1
    - metin: Yeni ödenek sözü verme; bütçeyi belediyeye bırak
      etki:
        grup.isci: -2
        parti_ici: -1
      bayrak:
        belediye_sonuc: yeni_soz_yok
      haber: "{il} belediyesinden sonraki maaş dönemini kendi bütçesinden karşılaması istendi; Hazine kalıcı taahhüt vermedi."
  anlati:
    mekan: "{il} garajı · banka ve sefer masası"
    amac: Ödenen ücretin gerisinde kalan hizmet ve belediye hesabını kimin yöneteceğine karar ver.
    sesler:
      - kim: sendika
        metin: Banka fişini gördüm. Bir sonraki ayın vardiyasını bu fiş ödemiyor; çizelgeyi birlikte yazalım.
      - kim: hazine
        metin: Bu ödeme belediyenin reklam faturası için verilmedi. Yeni bordro için otomatik talimat yok.
    belgeler:
      - ad: Banka ve bordro
        metin: Hazine gideri ödendi; personel dışı belediye borçları ayrı kaldı. Sendika bankaya yatan tutarı üye
          listesiyle karşılaştırıyor.
    secenekNotlari:
      - gerekce: Seferi sendikayla planlarsın.
        bedel: Sonraki ayın maaşını çözmüş olmazsın; belediye çizelgeden sorumludur.
      - gerekce: Ücretin dışındaki faturayı açarsın.
        bedel: Belediye yönetimi siyasi hedef alınmaya itiraz eder.
      - gerekce: Hazineye kalıcı ücret yükü yazmazsın.
        bedel: Bir sonraki gecikmenin riski şehirde kalır.
- id: belediye_maas_hesap
  tur: zincir
  kategori: yerel
  zincir: belediye_borcu
  asama: sonuc
  getiren: ozel_kalem
  degiskenler:
    il: muhalif_sehir
  metin:
    baslik: "{il} sefer panosunda boşluk"
    durum: Belediyenin personel bordrosu ve diğer faturaları yayımlandı. Açık hesap, vadesi gelen ücreti ödemedi.
      Hastane hattında sefer sayısı azaldı; başkan Hazine kesintisini, Hazine belediyenin harcamalarını
      gösteriyor.
  secenekler:
    - metin: Hastane hattına geçici taşıma hizmeti satın al
      etki:
        grup.esnaf: 1
        kamu_hizmet: 0.4
        grup.is_dunyasi: -0.5
      bayrak:
        belediye_sonuc: gecici_hat
      haber: "{il} hastane hattında geçici taşıma başladı; belediye personelinin ücret alacağı ödenmiş sayılmadı."
      icra:
        gun: 1
        odeme:
          metin: "{il} hastane hattı için bir dönemlik geçici taşıma"
          kalem: yatirim
          maliyet: 0.0003
          vade: 1
          tek_seferlik: true
    - metin: Kesinti ve harcamayı bağımsız incelemeye gönder
      etki:
        guven: 0.5
        grup.isci: -1
      bayrak:
        belediye_sonuc: hesap_incele
      haber: "{il} kesinti yazısı ve personel dışı giderleri incelemeye açıldı. Ücret için yeni ödenek çıkmadı."
      icra:
        gun: 1
    - metin: Belediye meclisine bırak; ek kaynak verme
      etki:
        grup.isci: -2
        grup.kentli: -1
      bayrak:
        belediye_sonuc: meclise_birak
      haber: "{il} belediye meclisinden yeni ödeme planını görüşmesi istendi; Hazine bu dosyada ödeme yapmadı."
  anlati:
    mekan: "{il} ulaşım panosu · açık hesap"
    amac: Hastane seferini geçici bir hizmetle ayırabilir ya da mali sorumluluğu açık tutabilirsin.
    sesler:
      - kim: ozel_kalem
        metin: "İki dosya var: bordro ve belediyenin başka faturaları. Birini yayımlayınca öbürü ödenmiyor."
      - kim: sendika
        metin: Hastane hattına taşeron otobüs koyabilirsiniz. Şoförlerin alacağı yine bordroda durur.
    belgeler:
      - ad: Yayımlanan hesap
        metin: Bordro ve personel dışı faturalar ayrı yayımlandı. Bu yayımdan sonra ücret için yeni ödeme emri yok.
    secenekNotlari:
      - gerekce: Hastane yoluna bir dönemlik hizmet alırsın.
        bedel: Kamu gideri doğar; sendikanın ücret alacağını çözmez.
      - gerekce: Merkez ve belediyenin hesaplarını inceletirsin.
        bedel: Rapor gelmeden kesinti veya usulsüzlük hükme bağlanmaz.
      - gerekce: Mali kararı yerel meclise bırakırsın.
        bedel: Sefer ve ücret bekleyişi sürer.

# ---- Zincir 2: Bakanın skandalı
- id: saglik_ihale_1
  kategori: parti
  zincir: bakan_skandali
  asama: tohum
  getiren: ozel_kalem
  kosul: { ay_en_az: 2 }
  metin:
    baslik: Sağlık Bakanı'nın oğlu ve hastane ihalesi
    durum: "Bağımsız bir haber sitesi, Sağlık Bakanı'nın oğlunun ortağı olduğu şirketin 4 milyar liralık bir şehir hastanesi ihalesini aldığını yazdı. Bakan haberin “siyasi bir operasyon” olduğunu söylüyor."
    kulis: "Bakan, oğlunun şirketin adını bile bilmediğini söyledi. Şirketin adı bakanın soyadı."
  secenekler:
    - metin: Bakanı görevden al
      etki: { grup.kentli: 2, grup.laik: 1, parti_ici: 4, itibar: 1 }
      bayrak: { saglik_bakani_gitti: true }
      sonraki: [{ kart: saglik_ihale_2b, gecikme: 3 }]
      haber: "Sağlık Bakanı görevden alındı; bakan “arkamdan iş çevrildi” dedi."
    - metin: Bakanı savun, haberi “operasyon” diye niteleyin
      etki: { grup.kentli: -2.5, grup.muhafazakar: 0.5, basin: -1, kutuplasma: 3 }
      sicil: { tur: yalan, kaynak: "Sağlık Bakanı'nın oğlunun ihalesi" }
      sonraki: [{ kart: saglik_ihale_2a, gecikme: 2 }]
      haber: "Cumhurbaşkanlığı Sağlık Bakanı'nın arkasında durdu."
    - metin: İhaleyi iptal et, Danıştay'a bırak
      etki: { grup.kentli: 1, guven: 0.5, butce_acigi: 0.05, parti_ici: 1 }
      ekonomi: { kalem: yatirim }
      haber: "Tartışmalı hastane ihalesi iptal edildi; bakan görevinde kaldı."

- id: saglik_ihale_2a
  kategori: parti
  tur: zincir
  zincir: bakan_skandali
  asama: doruk
  getiren: kamuoyu_danismani
  metin:
    baslik: Belgeler yayımlandı
    durum: "Haber sitesi bu kez ihale komisyonunun yazışmalarını yayımladı: teknik şartname, bakanın oğlunun şirketine göre yazılmış. Muhalefet Meclis soruşturması istiyor; ittifak ortağı sessiz."
  secenekler:
    - metin: Bakanı şimdi görevden al
      etki: { grup.kentli: 0.5, parti_ici: 3, rakip: 1 }
      haber: "Sağlık Bakanı belgelerin yayımlanmasının ardından görevden alındı."
    - metin: Haber sitesine erişim engeli getirt
      etki: { basin: -4, itibar: -2, grup.genc: -2, grup.kentli: -1.5 }
      sicil: { tur: baski, kaynak: "İhale belgelerine erişim engeli" }
      haber: "İhale belgelerini yayımlayan siteye erişim engeli getirildi; belgeler sosyal medyada yayıldı."
    - metin: Meclis soruşturmasına destek ver
      etki: { itibar: 1.5, parti_ici: 6, grup.kentli: 2 }
      haber: "İktidar Sağlık Bakanı hakkındaki Meclis soruşturma önergesine destek verdi."

- id: saglik_ihale_2b
  kategori: parti
  tur: zincir
  zincir: bakan_skandali
  asama: sonuc
  getiren: genel_sekreter
  metin:
    baslik: Eski bakanın anı kitabı
    durum: "Görevden aldığınız eski Sağlık Bakanı “Kabinede Bir Yıl” adlı bir anı kitabı çıkarıyor. Yayınevi, kitapta kabine toplantılarına dair “çarpıcı ayrıntılar” olduğunu duyurdu."
    kulis: "Kitabın arka kapağında bir alıntı var: “Toplantıların çoğu çay demlenirken bitti.”"
  secenekler:
    - metin: Eski bakanı arayıp bir büyükelçilik teklif et
      etki: { parti_ici: -2, itibar: -1 }
      haber: "Eski Sağlık Bakanı büyükelçi olarak atandı; kitabın yayımı “ileri bir tarihe” ertelendi."
    - metin: Kitabı görmezden gel
      etki: { rakip: 1, grup.kentli: -0.5 }
      haber: "“Kabinede Bir Yıl” çok satanlar listesinin ilk sırasına yerleşti."
    - metin: Kitaptaki iddialar için dava aç
      etki: { basin: -1, kutuplasma: 2, rakip: 1 }
      haber: "Cumhurbaşkanlığı, eski bakanın kitabı hakkında tazminat davası açtı; kitap ikinci baskıya girdi."

# ---- Zincir 3: Öğrenci protestosu
- id: yurt_ucretleri
  kategori: egitim
  zincir: ogrenci_protestosu
  asama: tohum
  getiren: egitim
  degiskenler: { il: rastgele_sehir }
  metin:
    baslik: Yurt ücretlerine yüzde 80 zam
    durum: "Devlet yurtlarının ücretleri yüzde 80 arttı. {il:deki} üniversitede öğrenciler yurt önünde parkta sabahlamaya başladı. Eylemin etiketi sosyal medyada gündemin ilk sırasında."
  secenekler:
    - metin: Zammı geri çek
      etki: { grup.genc: 3, butce_acigi: 0.05, parti_ici: 1 }
      haber: "Yurt ücretlerindeki zam geri çekildi; öğrenciler parkta kutlama yaptı."
    - metin: Öğrenci temsilcileriyle görüş, burs sayısını artır
      etki: { grup.genc: 1.5, butce_acigi: 0.04 }
      haber: "Bakanlık öğrenci temsilcileriyle görüştü; 50 bin ek burs açıklandı."
    - metin: Zammı savun, parktaki eylemi dağıttır
      etki: { grup.genc: -4, grup.kentli: -2, kutuplasma: 4 }
      sonraki: [{ kart: ogrenci_eylem_2, gecikme: 1 }]
      haber: "{il:de} parkta sabahlayan öğrencilere polis müdahale etti."

- id: ogrenci_eylem_2
  kategori: egitim
  tur: zincir
  zincir: ogrenci_protestosu
  asama: gelisme
  getiren: icisleri
  degiskenler: { il: rastgele_sehir }
  metin:
    baslik: Eylem yayılıyor
    durum: "Polis müdahalesinin görüntüleri yayıldı; eylem altı şehirdeki üniversitelere sıçradı. İçişleri Bakanı, eylemlerin “dış bağlantılı gruplarca” yönlendirildiğini düşünüyor. Emniyete göre 12 bin, öğrencilere göre 60 bin kişi sokakta."
  secenekler:
    - metin: Polisi geri çek, öğrencilere sesleniş yap
      etki: { grup.genc: 2.5, kutuplasma: -3, parti_ici: 2 }
      haber: "Cumhurbaşkanı öğrencilere seslendi: “Sizi duyuyorum.”"
    - metin: Üniversitelere uzaktan eğitim kararı ver
      etki: { grup.genc: -2, grup.kentli: -1.5, kutuplasma: 2 }
      haber: "Eylem yapılan üniversitelerde eğitim iki hafta uzaktan yapılacak."
    - metin: Eylemlerin arkasındaki “dış güçleri” işaret et
      etki: { grup.genc: -3, grup.milliyetci: 1.5, kutuplasma: 6, itibar: -1.5 }
      sicil: { tur: yalan, kaynak: "Öğrenci eylemlerine “dış güç” suçlaması" }
      sonraki: [{ kart: ogrenci_eylem_3, gecikme: 1 }]
      haber: "Cumhurbaşkanı öğrenci eylemlerinin arkasında dış güçler olduğunu söyledi."

- id: ogrenci_eylem_3
  kategori: egitim
  tur: zincir
  zincir: ogrenci_protestosu
  asama: doruk
  getiren: icisleri
  degiskenler: { il: rastgele_sehir }
  metin:
    baslik: "{il:de} bir öğrenci ağır yaralandı"
    durum: "{il:deki} eylemde gaz fişeği isabet eden bir tıp öğrencisi yoğun bakımda. Ailesi hastane önünde açıklama yapacak. Muhalefet İçişleri Bakanı'nın istifasını istiyor."
  secenekler:
    - metin: Aileyi ziyaret et, sorumlu polislerin açığa alınmasını iste
      etki: { grup.genc: 2, grup.kentli: 1.5, kutuplasma: -3, parti_ici: 2 }
      haber: "Cumhurbaşkanı yaralı öğrencinin ailesini ziyaret etti; iki emniyet amiri açığa alındı."
    - metin: İçişleri Bakanı'nı görevden al
      etki: { grup.genc: 1.5, grup.milliyetci: -1.5, parti_ici: 4 }
      haber: "İçişleri Bakanı görevden alındı."
    - metin: Polisi savun
      etki: { grup.genc: -4, grup.kentli: -2.5, grup.milliyetci: 1.5, kutuplasma: 5, itibar: -2 }
      haber: "Cumhurbaşkanı polisin “görevini yaptığını” söyledi."

# ---- Asgari ücret sonrası
- id: grev_uyarisi
  kategori: ekonomi
  zincir: grev
  asama: tohum
  getiren: sendika
  kosul: { bayrak: { asgari_dusuk: true } }
  metin:
    baslik: Konfederasyondan genel grev uyarısı
    durum: "İşçi konfederasyonu, asgari ücret kararının ardından metal ve liman işçileri için grev oylaması yaptı. Yüzde 82 evet çıktı. Limanlarda iş durursa ihracat günde 300 milyon dolar kaybedecek."
  secenekler:
    - metin: Asgari ücrete ara zam sözü ver
      etki: { grup.isci: 3, enflasyon: 0.3, guven: -1 }
      ekonomi:
        soz: { metin: "Asgari ücrete ara zam", kalem: sosyal, maliyet: 0.25, vade: 6, grup: grup.isci, asgari_artis: 10 }
      haber: "Hükümet asgari ücrete ara zam yapacağını açıkladı; grev ertelendi."
    - metin: Grevi millî güvenlik gerekçesiyle ertele
      etki: { grup.isci: -4, kutuplasma: 4, itibar: -1.5, grup.is_dunyasi: 1.5 }
      sicil: { tur: baski, kaynak: "Liman grevinin ertelenmesi" }
      haber: "Bakanlar Kurulu liman grevini “millî güvenlik” gerekçesiyle 60 gün erteledi."
    - metin: Grevin yapılmasına izin ver
      etki: { buyume: -0.3, grup.isci: 1, grup.is_dunyasi: -2, kur: 0.5 }
      haber: "Limanlarda grev başladı; gemiler açıkta bekliyor."
