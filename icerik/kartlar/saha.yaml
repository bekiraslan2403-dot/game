              bayrak:
                tashan_saha_tarih: true
              etki:
                grup.kiraci: 0.4
              anlatici: true
            - metin: Yalnız yerinde görülen durumu açıklayın.
              cevap: Ziyaretin gözlemleri açıklanacak; tamamlanma sözü verilmeyecek. Nermin basının hangi işi finanse edeceğiniz
                sorusunun kararınızı beklediğini hatırlatıyor.
              bayrak:
                tashan_saha_tarih: false
              anlatici: true
  secenekler:
    - metin: Tamamlanmayan işi ekiple bitir, tamamlananı koru
      saha_karari: program
      etki: {}
      tepkiler:
        - kim: saha_ayse
          metin: Bugün verdiğiniz cevabı da aynı dosyaya koyacağım. Önceki kaydın üstünü çizmeyeceğiz; yeni bir tarih varsa ayrıca
            takip edeceğiz.
    - metin: Bağımsız uygulama denetimini finanse et
      saha_karari: denetle
      etki: {}
      tepkiler:
        - kim: saha_ayse
          metin: İncelemeye ilk listedeki insanları da dahil edin. Başka bir işin tamamlanmış olması bu dosyanın cevabı olmasın.
    - metin: Yeni ödenek ayırmadan mevcut kararla devam et
      saha_karari: kapat
      etki: {}
      tepkiler:
        - kim: saha_ayse
          metin: O zaman mevcut durumu açıklayacağız. Tamamlanmayan iş varsa onu da söyleyeceğiz. Görüşme yapılması dosyanın
            kapandığı anlamına gelmesin.
- id: saha_karaburc_ilk
  tur: masa
  kategori: egitim
  getiren: saha_bora
  kalem: egitim
  saha:
    id: karaburc
    asama: ilk
  metin:
    baslik: Kapısı kilitli atölye
    durum: Bora Keskin atölyenin kapısını açamıyor. Havalandırma yenilemesi yarım kalmış, kullanım kabulü yapılmamış. Sanayi
      odası öğrencileri daha erken staja almak istiyor; okul bunun eksik uygulama derslerini karşılamayacağını söylüyor.
      Hazine ödeme dosyasında farklı iş kalemlerinin birbirine karıştığını belirtiyor.
  anlati:
    mekan: Karaburç · Meslek okulu atölyesi
    amac: Meslek okulunda havalandırma işi eksik. Öğrenciler uygulama dersi yapamıyor; işverenler staj takvimini öne çekmek
      istiyor.
    sesler:
      - kim: saha_bora
        metin: Bu sınıf geçen ay da uygulama yapamadı. Öğrenciye yine defterden makine anlatıyorum. Fabrikaya gönderelim
          diyorlar; çocuk orada öğrenir mi, yalnız üretime mi koşulur, onu sormuyorlar.
      - kim: egitim
        metin: Tadilat faturasıyla cihaz alımı aynı kabul dosyasına konmuş. Ödeme süreci ayrılmadan hangi işin eksik kaldığı
          görünmüyor. Okulu açıldı diye duyurmak için kullanım kabulü gerekiyor.
    belgeler:
      - ad: İlk dosyadaki kayıt
        metin: Yüklenici hakedişi havalandırma işiyle cihaz teslimini birlikte gösteriyor. Okulun kullanım kabulü yok. Sanayi
          odasının staj yazısı ise tamamlayıcı eğitim planı içermiyor.
    secenekNotlari:
      - gerekce: Doğrulanan eksik iş için uygulama programı açarsın.
        bedel: Kaynak ve imza gerekir. Kapasite yetersizse iki aylık iş gecikebilir.
      - gerekce: Kalıcı işi bekleyenlerin bir aylık ihtiyacını karşılarsın.
        bedel: Destek sona erdiğinde kalıcı iş hâlâ çözülmemiş olabilir.
      - gerekce: Yeni ödenek çıkarmadan mevcut idarelerin takvimini sürdürürsün.
        bedel: Görüşülen ihtiyaç açık kalır; yerel güven ve ilgili kesim etkilenir.
    sahne:
      baslik: Kapısı kilitli atölye
      adimlar:
        - kim: saha_bora
          metin: Bu sınıf geçen ay da uygulama yapamadı. Öğrenciye yine defterden makine anlatıyorum. Fabrikaya gönderelim
            diyorlar; çocuk orada öğrenir mi, yalnız üretime mi koşulur, onu sormuyorlar.
          secenekler:
            - metin: Atölyeyi öğrenci temsilcisiyle görelim.
              cevap: Bora kilitli bölümün önündeki ders çizelgesini gösteriyor. İptal edilen uygulamalar işaretli. Öğrenci temsilcisi
                bunların yerine hangi dersin konduğunu soruyor.
              iliski:
                saha_bora: 4
              etki: {}
              anlatici: true
            - metin: Okul ve sanayi odasını birlikte dinleyelim.
              cevap: İşveren stajın erken başlamasını savunuyor. Bora staj yerindeki eğitim sorumlusunu soruyor. Bu konuda henüz
                imzalı bir plan yok.
              iliski:
                saha_bora: 1
              etki: {}
              anlatici: true
            - metin: Fabrika programına geçelim.
              cevap: Okul gezisi kısalıyor. İşverenler istihdam hedeflerini anlatıyor; kapalı atölyenin eksik iş listesi yerinde
                incelenmiyor.
              iliski:
                saha_bora: -8
              etki:
                parti_ici: -0.3
              anlatici: true
