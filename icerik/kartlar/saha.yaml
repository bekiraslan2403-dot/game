- id: saha_tashan_ilk
  tur: masa
  kategori: afet
  getiren: saha_ayse
  kalem: yatirim
  saha:
    id: tashan
    asama: ilk
  metin:
    baslik: Anahtar var, su yok
    durum: Ayşe Demir sizi teslim edileceği söylenen bloğa götürüyor. Girişteki afişte açılış tarihi duruyor; içeride su
      akmıyor. Bakanlık inşaatın tamamlandığını, belediye bağlantı işinin kendilerine bırakıldığını söylüyor. Öğleden
      sonraki programda anahtar töreni var.
  anlati:
    mekan: Taşhan · Konut şantiyesi
    amac: Teslim listesine giren konutların bağlantıları bitmemiş. Konteynerdeki aileler taşınabilecekleri günü soruyor.
    sesler:
      - kim: saha_ayse
        metin: Bir aile çocuklarının yataklarını getirmiş. Vanayı açmışlar, su yok. Konteynerlerini de boşaltmışlar. Anahtar
          teslim edildi diye yardımları kesilecekmiş. Onlara hangi evin hazır olduğunu söyleyeyim?
      - kim: cevre
        metin: Bina teslim tutanağı imzalanmış. Şebeke bağlantısı ayrı işte kalmış; iki kurum birbirinin yazısını bekliyor.
          Töreni yapmakla suyu bağlamış olmayız. Kalan iş için ayrı ekip ve kaynak gerekiyor.
    belgeler:
      - ad: İlk dosyadaki kayıt
        metin: Teslim listesinde hane isimleri var. Bağlantı kabul tutanağında belediye imzası eksik; bina tamamlanma kaydı
          bunun yerine kullanılmış.
    secenekNotlari:
      - gerekce: Doğrulanan eksik iş için uygulama programı açarsın.
        bedel: Kaynak ve imza gerekir. Kapasite yetersizse iki aylık iş gecikebilir.
      - gerekce: Kalıcı işi bekleyenlerin bir aylık ihtiyacını karşılarsın.
        bedel: Destek sona erdiğinde kalıcı iş hâlâ çözülmemiş olabilir.
      - gerekce: Yeni ödenek çıkarmadan mevcut idarelerin takvimini sürdürürsün.
        bedel: Görüşülen ihtiyaç açık kalır; yerel güven ve ilgili kesim etkilenir.
    sahne:
      baslik: Anahtar var, su yok
      adimlar:
        - kim: saha_ayse
          metin: Bir aile çocuklarının yataklarını getirmiş. Vanayı açmışlar, su yok. Konteynerlerini de boşaltmışlar. Anahtar
            teslim edildi diye yardımları kesilecekmiş. Onlara hangi evin hazır olduğunu söyleyeyim?
          secenekler:
            - metin: Önce daireye gidelim; aile de bizimle gelsin.
              cevap: Ayşe sizi boş dairenin mutfağına götürüyor. Vanayı birlikte açıyorsunuz. Musluk susuyor; duvardaki yeni boya
                henüz kokuyor.
              iliski:
                saha_ayse: 4
              etki: {}
              anlatici: true
            - metin: Önce kurumları aynı masaya çağırın.
              cevap: Şantiye şefi ve belediye görevlisi geliyor. İkisi de kendi işinin bittiğini söylüyor. Aileler toplantı odasının
                dışında kalıyor.
              iliski:
                saha_ayse: 1
              etki: {}
              anlatici: true
            - metin: Programı bozmayalım; tören alanına geçelim.
              cevap: Aileler kürsünün arkasındaki çite yaklaşıyor. Şantiye gezisi programdan çıkıyor. Yerel başkan anahtarı hangi
                kameraya göstereceğinizi anlatıyor.
              iliski:
                saha_ayse: -8
              etki:
                parti_ici: -0.3
              anlatici: true
        - kim: cevre
          metin: Şantiye şefi bina tutanağını uzatıyor. Belediye görevlisi bağlantı kabulünün ayrı olduğunu söylüyor. Hangisini
            ziyaret kaydına geçireceksiniz?
          secenekler:
            - metin: Bağlantı tutanağını ve eksik işleri birlikte kayda alın.
              cevap: İki kurum aynı eksik iş listesini imzalıyor. Dosyada artık bina tamamlandı kaydıyla bağlantı sorunu birbirinden
                ayrılmış durumda. Kalan işin kapsamı doğrulandı.
              bayrak:
                tashan_saha_belge: true
              kosul:
                iliski:
                  saha_ayse:
                    en_az: 45
              kilitNedeni: Yerel temsilci kendisini dışlanmış görüyor; ortak tespitte yer almayı kabul etmiyor.
              anlatici: true
            - metin: Bina tutanağını yeterli kabul edin.
              cevap: Bina tutanağı alındı. Şebeke bağlantısının kabulü hâlâ belgelenmedi. Elinizdeki kayıtla ailelerin
                taşınabileceğini doğrulayamıyorsunuz.
              bayrak:
                tashan_saha_belge: false
              anlatici: true
            - metin: Tutanak tartışmasını sonra yapalım.
              cevap: İki kurum kendi kopyasıyla ayrılıyor. Ziyaret notuna su şikâyeti geçti; işin kapsamı ve sorumlusu ortak kayıtla
                doğrulanmadı.
              bayrak:
                tashan_saha_belge: false
              anlatici: true
        - kim: ozel_kalem
          metin: Yerel basın açıklama bekliyor. Uygulama kararını henüz vermediniz. Şimdi kesin tarih açıklarsak, kurumların işi
            yetiştirememesi sizin sözünüz olarak geri dönecek.
          secenekler:
            - metin: Yazılı karar olmadan teslim tarihi açıklamayın.
              cevap: Nermin, açıklamadan teslim tarihini çıkarıyor. Ziyarette görülenler kayıtta kalacak. Uygulama kararından sonra
                ödenek ve iş takvimi ayrı duyurulacak.
              bayrak:
                tashan_saha_tarih: false
              anlatici: true
            - metin: İşi iki ayda tamamlayacağımızı açıklayın.
              cevap: Nermin tarihi not ediyor. “Bunu sizin taahhüdünüz olarak duyuracağız. Kaynak ayırmazsanız da kurum yetiştiremezse
                de o açıklama karşınıza çıkacak.”
              bayrak:
                tashan_saha_tarih: true
              etki:
                grup.kiraci: 0.4
              anlatici: true
            - metin: Yalnız yerinde görülen durumu açıklayın.
              cevap: Ziyaretin gözlemleri açıklanacak; tamamlanma sözü verilmeyecek. Nermin basının hangi işi finanse edeceğiniz
                sorusunun kararınızı beklediğini hatırlatıyor.
              bayrak:
                tashan_saha_tarih: false
              anlatici: true
  secenekler:
    - metin: Bağlantı işini ortak ekiple tamamlat
      saha_karari: program
      etki: {}
      tepkiler:
        - kim: saha_ayse
          metin: Ödeneğin çıkarıldığını söyleyeceğim. İş bitmiş gibi duyurmayacağız. İlk listedeki ihtiyacın karşılanıp
            karşılanmadığını burada göreceğiz.
    - metin: Ailelere bir aylık gider desteği çıkar
      saha_karari: gecici
      etki: {}
      tepkiler:
        - kim: saha_ayse
          metin: Bu destek bugünkü gideri hafifletir. Kalıcı işin tamamlandığını söyleyemem; bir ay sonra aynı ihtiyacın yeniden
            karşımıza çıkacağını biliyoruz.
    - metin: Yeni ödenek ayırma; mevcut kurum programını sürdür
      saha_karari: reddet
      etki: {}
      tepkiler:
        - kim: saha_ayse
          metin: Yanıtınızı buradaki insanlara aktaracağım. Ziyaret yaptığınız için iş çözülmüş gibi bir açıklamaya
            katılmayacağız.
- id: saha_tashan_takip
  tur: masa
  kategori: afet
  getiren: saha_ayse
