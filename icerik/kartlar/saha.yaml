    secenekNotlari:
      - gerekce: İş bitmişse korur; sürüyorsa ek teknik ekiple tamamlama yolunu açarsın.
        bedel: Eksik işte yeni kaynak ve imza gerekir. Önceki gecikme silinmez.
      - gerekce: Uygulamanın bağımsız incelemesini yaptırırsın.
        bedel: Denetim ödeneği ve imza gerekir; rapor gelecek ay gelir. Yapımın yerine geçmez.
      - gerekce: Yeni ödeme yapmadan mevcut uygulamayı sürdürürsün.
        bedel: Açık iş ve tutulmamış takvim olduğu gibi kalır.
    sahne:
      baslik: Aynı dairenin kapısında
      adimlar:
        - kim: saha_ayse
          metin: Komşularınız size ne dedi diye soruyorlar. Ben de ilk ziyaretin tutanağını gösteriyorum. Bugün o daireye yeniden
            girelim; kararla burada olanı aynı şeymiş gibi anlatmayalım.
          secenekler:
            - metin: Aynı daireyi aileyle yeniden görelim.
              cevap: Ayşe eski teslim kâğıdını yanında getiriyor. Yeni ziyarette görülen durum, ilk kayıtla karşılaştırılacak. Başka
                bir bloğun açılışı bu kontrolün yerine geçmeyecek.
              iliski:
                saha_ayse: 4
              etki: {}
              anlatici: true
            - metin: Kurumların son kayıtlarını burada karşılaştıralım.
              cevap: İki kurumun ilerleme kaydı dosyaya eklenecek. Ayşe ailelerin gördüklerini ayrıca yazmak istiyor; buna da yer
                ayrılıyor.
              iliski:
                saha_ayse: 1
              etki: {}
              anlatici: true
            - metin: Sunumu dinleyelim; daireyi gezmeyelim.
              cevap: Şantiye sunumu dinleniyor. Aynı daire yerinde kontrol edilmediği için yeni bir yapım kapsamı bu ziyaretle
                doğrulanamıyor.
              iliski:
                saha_ayse: -8
              etki:
                parti_ici: -0.3
              anlatici: true
        - kim: cevre
          metin: İlk ziyaret kaydı ile son uygulama dosyası burada. Yeni talimat için aynı işin bugünkü kapsamını birlikte
            doğrulamamız gerekiyor.
          secenekler:
            - metin: İlk kayıtla son kabulü yerinde karşılaştırın.
              cevap: Yerel temsilci ve uygulayıcı aynı işi kontrol ediyor. Tamamlanan ve eksik kalan bölümler ayrı kaydedildi; yeni
                kararın dayanağı doğrulandı.
              bayrak:
                tashan_saha_belge: true
              kosul:
                iliski:
                  saha_ayse:
                    en_az: 45
              kilitNedeni: Yerel temsilci kendisini dışlanmış görüyor; ortak tespitte yer almayı kabul etmiyor.
              anlatici: true
            - metin: Önceki ödeneği yeterli kayıt sayın.
              cevap: Ödeme kaydı alındı. Fakat para ayrılması işin bugünkü fiziksel durumunu göstermiyor. Bu ziyaretle yeni yapım
