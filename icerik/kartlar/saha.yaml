    mekan: Karaburç · Meslek okulu atölyesi
    amac: Meslek okulunda havalandırma işi eksik. Öğrenciler uygulama dersi yapamıyor; işverenler staj takvimini öne çekmek
      istiyor.
    sesler:
      - kim: saha_bora
        metin: Ödeneğin çıktığı günü de ders yaptığımız günü de ayrı işaretliyorum. Öğrenciye birincisini gösterip devamsızlık
          yazamam. Bugün hangi durumda olduğumuzu açıkça konuşalım.
      - kim: egitim
        metin: Tadilat faturasıyla cihaz alımı aynı kabul dosyasına konmuş. Ödeme süreci ayrılmadan hangi işin eksik kaldığı
          görünmüyor. Okulu açıldı diye duyurmak için kullanım kabulü gerekiyor.
    belgeler:
