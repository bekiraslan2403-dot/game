    durum: Bora Keskin ilk ziyaretteki ders çizelgesini saklamış. Okul yönetimi son uygulama kaydını önünüze koyuyor. Sanayi
      odası staj takvimini yeniden soruyor; öğrenciler atölyenin fiilen kullanılmasına bakıyor.
