              anlatici: true
            - metin: Yeni bir kontrol yapmadan görüşmeyi bitirelim.
              cevap: Yeni kontrol kaydı çıkmadı. Önceki uygulama raporu dosyada kalacak; bu ziyarette yeni yapım kapsamı doğrulanmış
