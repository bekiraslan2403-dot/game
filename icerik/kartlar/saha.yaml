        metin: Komşularınız size ne dedi diye soruyorlar. Ben de ilk ziyaretin tutanağını gösteriyorum. Bugün o daireye yeniden
          girelim; kararla burada olanı aynı şeymiş gibi anlatmayalım.
      - kim: cevre
        metin: Bina teslim tutanağı imzalanmış. Şebeke bağlantısı ayrı işte kalmış; iki kurum birbirinin yazısını bekliyor.
          Töreni yapmakla suyu bağlamış olmayız. Kalan iş için ayrı ekip ve kaynak gerekiyor.
    belgeler:
      - ad: İlk dosyadaki kayıt
        metin: Teslim listesinde hane isimleri var. Bağlantı kabul tutanağında belediye imzası eksik; bina tamamlanma kaydı
