  getiren: ziyaret_ciftci
  kalem: yatirim
  ziyaret:
    id: ciftci
    asama: takip
  metin:
    baslik: Ekim hesabı kapanmadı
    durum: Birlik, destek kararı ile üreticinin aldığı ödemeyi ayıran bir açıklama hazırlıyor. Kooperatif desteğine girmeyen
      işletmeler de sıraya girmiş. Hazine, geçici yardımı kalıcı programa çevirmeden önce yeniden karar istiyor.
  anlati:
    mekan: Cumhurbaşkanlığı · Takip dosyası
    amac: Önceki yanıtının uygulamadaki karşılığına karar ver.
    sesler:
      - kim: ziyaret_ciftci
        metin: Verilen desteği inkâr etmeyiz. Ama alamayan üyelerimizi de listeden silmeyiz.
      - kim: tarim
        metin: Genel destek ile kooperatif yardımı ayrı kalemler. Geçici ödemeyi gelecek sezonun düzenli desteği gibi
          duyurmayalım.
    belgeler:
      - ad: İlk görüşmenin talebi
        metin: Kooperatif hesabı vadeli gübre alımlarını gösteriyor. Birliğin ekimden vazgeçme tahmini üyelerin beyanına
          dayanıyor; bütün bölgenin kesin üretim kaybı değil.
    secenekNotlari:
      - gerekce: Üretim desteğinin genel kapsamı büyür.
        bedel: Büyük işletmeler de yararlanır; bütçenin tarım gideri artar.
      - gerekce: Dar kapsamlı desteğin ödeneğini çıkarırsın; önceki söz varsa onu yerine getirirsin.
        bedel: Gider bütçeye yazılır. Destek zaten ödendiyse yeniden ödeme yapılmaz.
      - gerekce: Yeni düzenleme veya ödeme yapmadan dosyayı kapatırsın.
        bedel: Daha önce verdiğin söz varsa silinmez. Ödenmemiş söz vadesinde sicile yansır.
  secenekler:
