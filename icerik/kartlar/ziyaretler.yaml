        grup.isci: -1.2
      tepkiler:
        - kim: sendika
          metin: Bunu kurulumuza söyleyeceğim. İş bırakma kararını artık ben tek başıma durduramam.
- id: kabul_isveren
  tur: masa
  kategori: ekonomi
  getiren: ziyaret_isveren
  kalem: yatirim
  ziyaret:
    id: isveren
    asama: gorusme
  metin:
    baslik: İmzası eksik sipariş
    durum: Ferit Savaş yeni üretim hattının çizimini açıyor. Yabancı alıcının siparişi henüz kesin değil. Heyet, teknoloji
      desteği artırılırsa yatırımın başlayacağını söylüyor; istihdam sayısını protokole yazmaktan kaçınıyor. Bakanlık
      başka firmaların da aynı desteği isteyeceğini hatırlatıyor.
  anlati:
    mekan: Cumhurbaşkanlığı · Kabul salonu
    amac: Yatırım teşviki isteyen heyet, bağlayıcı olmayan istihdam taahhüdü getiriyor.
    sesler:
      - kim: ziyaret_isveren
        metin: Ortaklarım desteği almadan krediye imza atmıyor. Alıcı da hattın kurulacağını görmeden siparişi kesinleştirmiyor.
          Bu döngüyü kırmamı istiyorlar. Ama size bugün çalışan sayısı yazarsam tutamayacağım bir taahhüde imza atmış
          olurum.
      - kim: sanayi
        metin: Ar-Ge desteğini artırmak tek şirkete çek yazmak değildir. Program herkese açılır; maliyeti kesin, bu firmanın
          istihdam sözü belirsiz kalır.
    belgeler:
      - ad: Heyetin dosyası
        metin: Alıcının niyet mektubu bağlayıcı değil. Firmanın kendi katkısı var, ancak kredi anlaşması kamu desteği kararına
          bağlı tutulmuş.
    secenekNotlari:
      - gerekce: Sektör genelinde yatırım desteğini genişletirsin.
        bedel: Bütçe yüklenir; heyetin vaat ettiği istihdam garanti edilmez.
      - gerekce: Kalıcı düzenleme yerine dar kapsamlı bir destek taahhüt edersin.
        bedel: Henüz ödeme yapılmaz. Vadesinde ödenek çıkarılmazsa söz bozulur.
      - gerekce: Yeni taahhüt vermeden mevcut politikayı sürdürürsün.
        bedel: Heyet kararı kamuoyuna taşıyabilir; ilgili grubun tepkisi artar.
  secenekler:
    - metin: Ar-Ge desteğini bütün başvurular için artır
      etki: {}
      politika: &a2
        id: arge
        hedef: 3
        yon: artir
      sonraki:
        - kart: takip_isveren
          gecikme: 1
      tepkiler:
        - kim: ziyaret_isveren
          metin: Programın bütün firmalara açık olduğunu kabul ediyoruz. Sipariş ve çalışan sayısı için bizden ayrıca belge
            isteyeceksiniz; onları bugün getiremedim.
    - metin: Ortak teknoloji merkezi için sınırlı ödenek sözü ver
      etki: {}
      ekonomi:
        soz:
          metin: Ortak teknoloji merkezine başlangıç desteği
          kalem: yatirim
          maliyet: 0.018
          vade: 2
          tek_seferlik: true
          grup: grup.is_dunyasi
      sonraki:
        - kart: takip_isveren
          gecikme: 1
      tepkiler:
        - kim: ziyaret_isveren
          metin: Tek şirketin hattı yerine ortak merkez önerinizi üyelerimize götürürüz. Kendi yatırımımızı yine kredi kuruluna
            anlatmamız gerekecek.
    - metin: Sipariş kesinleşmeden kamu desteğini genişletme
      etki:
        grup.is_dunyasi: -2.5
      sonraki:
        - kart: takip_isveren
          gecikme: 1
      tepkiler:
        - kim: ziyaret_isveren
          metin: O halde başka finansman arayacağız. Yatırımı burada tutacağımızı bugün söyleyemem.
