  getiren: ziyaret_buyukelci
  kalem: sosyal
  ziyaret:
    id: buyukelci
    asama: gorusme
  metin:
    baslik: Rapora girmeyen paragraf
    durum: Büyükelçi Elena Varga raporun taslağını getirmemiş. Yatırımcı davaları ve yargı güvenceleri hakkında hükümetin
      hangi adımını yazabileceklerini soruyor. Bakanlık olumlu bir açıklama istiyor; büyükelçi kanun çıkmadan sonucu
      değiştirme sözü vermiyor.
  anlati:
    mekan: Cumhurbaşkanlığı · Kabul salonu
    amac: İlerleme raporundan önce yargı güvenceleri hakkında somut adım soruyor.
    sesler:
      - kim: ziyaret_buyukelci
        metin: Raportörler dosyayı cuma günü kapatıyor. Sizin yanıtınıza yer ayırdılar. Bana hangi kararı ekleyebileceğimizi
          söyleyin. Olumlu bir değerlendirmeyi şimdiden vaat etmemi istemeyin; bu benim tek başıma verebileceğim bir
          karar değil.
      - kim: disisleri
        metin: Bir hukuk reformunu dışarıdan övgü almak için sunduğumuz görüntüsü içeride tepki çeker. Teknik işbirliği daha
          sınırlı kalır; temel eleştiriyi ortadan kaldırmaz.
    belgeler:
      - ad: Heyetin dosyası
        metin: Elçilik notu raporun nihai metni değil. Adli güvencelere ilişkin sorular resmî ve somut; olumlu rapor veya
          yatırım taahhüdü içermiyor.
    secenekNotlari:
      - gerekce: Rapor tartışmasını somut bir yasama adımına bağlarsın.
        bedel: Meclis onayı gerekir; dışarıdan siyasi veya mali karşılık garanti edilmez.
      - gerekce: Kalıcı düzenleme yerine dar kapsamlı bir destek taahhüt edersin.
        bedel: Henüz ödeme yapılmaz. Vadesinde ödenek çıkarılmazsa söz bozulur.
      - gerekce: Yeni taahhüt vermeden mevcut politikayı sürdürürsün.
        bedel: Heyet kararı kamuoyuna taşıyabilir; ilgili grubun tepkisi artar.
  secenekler:
    - metin: Yargı güvencelerini güçlendiren kanun teklifini sun
      etki: {}
      politika: &a8
        id: yargi_reformu
        hedef: 3
        yon: artir
      sonraki:
        - kart: takip_buyukelci
          gecikme: 1
      tepkiler:
        - kim: ziyaret_buyukelci
          metin: Teklifi kayda alacağız. Nihai raporda yasama sürecinin hangi aşamada olduğunu ayrıca belirtmek zorundayız. Bugün
            olumlu sonuç taahhüdü veremem.
    - metin: Adli eğitim işbirliği için sınırlı kaynak sözü ver
      etki: {}
      ekonomi:
        soz:
          metin: Adli eğitim ve teknik işbirliği ödeneği
          kalem: sosyal
          maliyet: 0.005
          vade: 2
          tek_seferlik: true
          grup: grup.kentli
      sonraki:
        - kart: takip_buyukelci
          gecikme: 1
      tepkiler:
        - kim: ziyaret_buyukelci
          metin: Teknik işbirliğini kaydederiz. Bu programın hukuk güvencelerine ilişkin sorularımıza cevap olmadığını da
            belirtmemiz gerekir.
    - metin: Yeni adım atmadan mevcut tutumu savun
      etki:
        grup.kentli: -2.5
      sonraki:
        - kart: takip_buyukelci
          gecikme: 1
      tepkiler:
        - kim: ziyaret_buyukelci
          metin: Görüşünüzü aktaracağım. Rapordaki değerlendirmeyi değiştireceğimizi söyleyemem.
