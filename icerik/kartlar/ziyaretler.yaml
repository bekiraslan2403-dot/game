# Kabul salonu: görüşmeler ve gerçek uygulama sonucuna dönen takip dosyaları.
- id: kabul_emekli
  tur: masa
  kategori: ekonomi
  getiren: ziyaret_emekli
  kalem: emekli
  ziyaret:
    id: emekli
    asama: gorusme
  metin:
    baslik: İkramiyeyi bekleyen zarf
    durum: Meral Özden, dernek üyelerinden topladığı fişleri masaya bırakıyor. Zarfın üstüne ikramiye tarihi yazılmış;
      içindeki borçların çoğu o tarihten önce ödenecek. Aylıklara kalıcı artış istiyor. Hazine, tek seferlik yardım ile
      her ay tekrarlanacak yükün ayrılmasını istiyor.
  anlati:
    mekan: Cumhurbaşkanlığı · Kabul salonu
    amac: Aylık artışının kira ve ilaç masrafına yetişmediğini söylüyor.
    sesler:
      - kim: ziyaret_emekli
        metin: Naciye Hanım geçen ay gözlüğünü değiştiremedi. Bu ay aidatını da veremedi; derneğe uğramaya utanıyor. Bana
          ikramiyeyi sordu. Ona yine “görüşeceğiz” diyemem. Buradan bir cevapla çıkmam gerekiyor.
      - kim: hazine
        metin: Kalıcı artış kanun gerektiriyor. Tek seferlik destek daha dar tutulabilir; gelecek ayın kirasını çözmez. İkisini
          de aynı kaynak varmış gibi sunamayız.
    belgeler:
      - ad: Heyetin dosyası
        metin: Üyelerin gönderdiği örneklerde ilaç katkı payı ve kira birlikte aylığın büyük bölümünü götürüyor. Liste bütün
          emeklileri temsil etmiyor; dernek en zor durumdaki üyelerini seçmiş.
    secenekNotlari:
      - gerekce: Kalıcı artışı Meclis’e götürürsün.
        bedel: Ödeme kararı henüz çıkmaz; kabul edilirse gider her ay sürer.
      - gerekce: Kalıcı düzenleme yerine dar kapsamlı bir destek taahhüt edersin.
        bedel: Henüz ödeme yapılmaz. Vadesinde ödenek çıkarılmazsa söz bozulur.
      - gerekce: Yeni taahhüt vermeden mevcut politikayı sürdürürsün.
        bedel: Heyet kararı kamuoyuna taşıyabilir; ilgili grubun tepkisi artar.
  secenekler:
    - metin: Emekli aylığı artışını fiyatların üzerine taşıyan teklifi sun
      etki: {}
      politika: &a1
        id: emekli_aylik
        hedef: 3
        yon: artir
      sonraki:
        - kart: takip_emekli
          gecikme: 1
      tepkiler:
        - kim: ziyaret_emekli
          metin: Teklifin verildiğini söyleyeceğim. Kabul edildiğini söylemem için oylamayı görmem gerekir. Üyeler borcunu henüz
            gelmemiş paraya göre kurmasın.
    - metin: Düşük aylıklı emekliler için geçici destek sözü ver
      etki: {}
      ekonomi:
        soz:
          metin: Düşük aylıklı emeklilere geçici destek
          kalem: emekli
          maliyet: 0.025
          vade: 2
          tek_seferlik: true
          grup: grup.emekli
      sonraki:
        - kart: takip_emekli
          gecikme: 1
      tepkiler:
        - kim: ziyaret_emekli
          metin: Üyelerime kalıcı artış değil, bir defalık destek konuştuğumuzu söyleyeceğim. Ödenek çıkana kadar ödeme tarihi
            vermeyeceğim.
    - metin: Bu bütçeyle yeni ödeme yapamayacağımı açıkla
      etki:
        grup.emekli: -2.5
      sonraki:
        - kart: takip_emekli
          gecikme: 1
      tepkiler:
        - kim: ziyaret_emekli
          metin: O zaman ikramiye müjdesi de vermeyin. Üyelerimiz itirazlarını meydanda anlatacak.
- id: takip_emekli
  tur: masa
  kategori: ekonomi
  getiren: ziyaret_emekli
  kalem: emekli
  ziyaret:
    id: emekli
    asama: takip
  metin:
    baslik: Zarfın ardından
    durum: Dernek bu kez toplantı duyurusunu gönderiyor. Sadece ne söylendiğini değil, neyin yürürlüğe girdiğini üyelerinin
      önünde açıklamak zorunda. Kalıcı artışın dışında kalanlar hâlâ destek istiyor.
  anlati:
    mekan: Cumhurbaşkanlığı · Takip dosyası
    amac: Önceki yanıtının uygulamadaki karşılığına karar ver.
    sesler:
      - kim: ziyaret_emekli
        metin: Kararınızı olduğu gibi okuyacağız. Ama tek seferlik para alanın gelecek ay ne yapacağını da sormaya devam
          edeceğiz.
      - kim: hazine
        metin: Kalıcı artışın yürürlük durumu ile geçici desteğin ödeme kaydı ayrı. Birindeki adım diğerinin yerine geçmez.
    belgeler:
      - ad: İlk görüşmenin talebi
        metin: Üyelerin gönderdiği örneklerde ilaç katkı payı ve kira birlikte aylığın büyük bölümünü götürüyor. Liste bütün
          emeklileri temsil etmiyor; dernek en zor durumdaki üyelerini seçmiş.
    secenekNotlari:
      - gerekce: Kalıcı artışı Meclis’e götürürsün.
        bedel: Ödeme kararı henüz çıkmaz; kabul edilirse gider her ay sürer.
      - gerekce: Dar kapsamlı desteğin ödeneğini çıkarırsın; önceki söz varsa onu yerine getirirsin.
        bedel: Gider bütçeye yazılır. Destek zaten ödendiyse yeniden ödeme yapılmaz.
      - gerekce: Yeni düzenleme veya ödeme yapmadan dosyayı kapatırsın.
        bedel: Daha önce verdiğin söz varsa silinmez. Ödenmemiş söz vadesinde sicile yansır.
  secenekler:
    - metin: Emekli aylığı artışını fiyatların üzerine taşıyan teklifi sun
      etki: {}
      politika: *a1
      tepkiler:
        - kim: ziyaret_emekli
          metin: Son kararı ve uygulamada neyin değiştiğini izlemeye devam edeceğiz. Bu görüşme, itirazlarımızdan vazgeçtiğimiz
            anlamına gelmiyor.
    - metin: Dar kapsamlı desteğin ödeneğini şimdi çıkar
      etki: {}
      destek:
        kaynak: kabul_emekli
      tepkiler:
        - kim: ziyaret_emekli
          metin: Bu kaynağın hangi ihtiyaç için ayrıldığını açıkça anlatacağız. Daha geniş talebimizin karşılandığını
            söylemeyeceğiz.
    - metin: Yeni taahhüt verme, mevcut kararla dosyayı kapat
      etki:
        grup.emekli: -1.2
      tepkiler:
        - kim: ziyaret_emekli
          metin: O zaman ikramiye müjdesi de vermeyin. Üyelerimiz itirazlarını meydanda anlatacak.
- id: kabul_sendika
  tur: masa
  kategori: ekonomi
  getiren: sendika
  kalem: sosyal
  ziyaret:
    id: sendika
    asama: gorusme
  metin:
    baslik: Ücret daha yatmadan
    durum: Zeynep Yıldırım bordro ile market hesabını yan yana koyuyor. Üç fabrikada vardiya temsilcileri iş bırakmayı
      tartışıyor. İşverenler ücret artarsa sipariş kaybını gerekçe gösterip işçi çıkarabileceklerini bildirmiş. Zeynep,
      toplantı fotoğrafı değil, ücret konusunda yanıt istiyor.
  anlati:
    mekan: Cumhurbaşkanlığı · Kabul salonu
    amac: Ara zam talebiyle birlikte işyerlerinin işten çıkarma uyarılarını getiriyor.
    sesler:
      - kim: sendika
        metin: Gece vardiyasından gelen üç temsilci dışarıda bekliyor. Biri dün çocuğunun okul taksidini kapatmak için avans
          istemiş. İşveren sipariş azalırsa işçi çıkaracağını söylüyor. İkisine birden cevap veremiyorum artık.
      - kim: calisma
        metin: Ücreti hemen artırabiliriz; maliyet fiyatlara ve işe alımlara yansır. Daha küçük bir destek nefes aldırır ama
          ücret pazarlığını bitirmez.
    belgeler:
      - ad: Heyetin dosyası
        metin: Konfederasyonun örnek bordroları düşük ücretli üyelerden geliyor. İşverenlerin işten çıkarma uyarıları ise henüz
          imzalı bir takvim içermiyor.
    secenekNotlari:
      - gerekce: Artış doğrudan hane gelirine girer.
        bedel: Üretim maliyeti ve fiyat baskısı artar; işverenler karşı çıkar.
      - gerekce: Kalıcı düzenleme yerine dar kapsamlı bir destek taahhüt edersin.
        bedel: Henüz ödeme yapılmaz. Vadesinde ödenek çıkarılmazsa söz bozulur.
      - gerekce: Yeni taahhüt vermeden mevcut politikayı sürdürürsün.
        bedel: Heyet kararı kamuoyuna taşıyabilir; ilgili grubun tepkisi artar.
  secenekler:
    - metin: Asgari ücrete yüzde on iki ara zam yap
      etki:
        grup.isci: 3
        grup.is_dunyasi: -2
        enflasyon: 0.35
        butce_acigi: 0.045
      ekonomi:
        asgari_artis: 12
        kalem: sosyal
      sonraki:
        - kart: takip_sendika
          gecikme: 1
      tepkiler:
        - kim: sendika
          metin: Ücret kararını bordrodan kontrol edeceğiz. Fiyatlara ne kadarının yansıyacağını da takip edeceğiz.
    - metin: Daha küçük ücret desteği için ödenek sözü ver
      etki: {}
      ekonomi:
        soz:
          metin: Düşük ücretli hanelere geçici gider desteği
          kalem: sosyal
          maliyet: 0.04
          vade: 2
          tek_seferlik: true
          grup: grup.isci
      sonraki:
        - kart: takip_sendika
          gecikme: 1
      tepkiler:
        - kim: sendika
          metin: Bu ara zammın yerine geçmez. Ödeme yapılırsa işçilere ne kadar yansıdığını gösterebilirim. Şimdilik yalnız söz
            verdiğinizi söyleyeceğim.
    - metin: Ara zam yapma, mevcut ücret takvimini koru
      etki:
        grup.isci: -2.5
      sonraki:
        - kart: takip_sendika
          gecikme: 1
      tepkiler:
        - kim: sendika
          metin: Bunu kurulumuza söyleyeceğim. İş bırakma kararını artık ben tek başıma durduramam.
