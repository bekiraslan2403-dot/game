- id: kabul_deprem
  tur: masa
  kategori: afet
  getiren: ziyaret_deprem
  kalem: yatirim
  ziyaret:
    id: deprem
    asama: gorusme
  metin:
    baslik: Anahtar listesinde bir boşluk
    durum: Sevil Arı, teslim törenine çağrılan ailelerin listesini getiriyor. Bazı bloklarda su bağlantısı bitmemiş; başka
      ailelerin hak sahipliği itirazı bekliyor. Bakanlık takvimi hızlandırmak istiyor. Sevil, tören yapılırken
      konteynerde kalanların unutulacağından korkuyor.
  anlati:
    mekan: Cumhurbaşkanlığı · Kabul salonu
    amac: Teslim edilecek konutların listesiyle altyapı eksiklerini karşılaştırmak istiyor.
    sesler:
      - kim: ziyaret_deprem
        metin: Geçen hafta komşum perdelerini aldı, evine taşınacak diye. Su bağlanmadığını öğrenince kolileri konteynere geri
          taşıdık. Teslim listesinde adı var. Orada kaldığı her gün için derneği arıyor. Ne söylememi istersiniz?
      - kim: cevre
        metin: Programı hızlandırırsak ödenek ve personel gerekecek. Altyapı işi aynı gece bitmez. Geçici barınma desteğini
          ayrıca sürdürebiliriz.
