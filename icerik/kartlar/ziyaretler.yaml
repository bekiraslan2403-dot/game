      - kim: ziyaret_sehit
        metin: Son ziyarette bize bir araç tahsis edileceği söylendi. Sevk günü aradık, araç başka programdaymış. Aileler
          aralarında yol parası topladı. Tören için otobüs bulunuyor; hastane için neden bulunamadığını bana soruyorlar.
      - kim: saglik
        metin: Sağlık kaynağını büyütmek hizmeti genel olarak güçlendirir; belirli bir aileye sıra garantisi veremeyiz. Geçici
          yol ve konaklama desteği daha dar bir çözüm.
    belgeler:
      - ad: Heyetin dosyası
        metin: Dernek, üyelerinin sevk ve yol giderlerini belgelemiş. Hastanenin bütün kapasite hesabı dosyada yok; tedavi
          tarihi için hekim onayı gerekiyor.
    secenekNotlari:
      - gerekce: Genel sağlık hizmetine daha fazla kaynak ayırırsın.
        bedel: Sağlık gideri artar; personel eksikse sonuç gecikir.
