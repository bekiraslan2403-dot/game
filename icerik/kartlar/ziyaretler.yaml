- id: kabul_gazeteci
  tur: masa
  kategori: medya
  getiren: ziyaret_gazeteci
  kalem: sosyal
  ziyaret:
    id: gazeteci
    asama: gorusme
  metin:
    baslik: Kayıt cihazı açık
    durum: Dilan Acar kayıt cihazını masaya koyuyor. Yerel gazetelerin yayın yaptırımları ve kamu ilanlarından dışlanmaları
      hakkında sorular hazırlamış. Röportajın yayımdan önce onaya gönderilmesini kabul etmiyor. Özel Kalem, canlı bir
      tartışmanın parti içinde rahatsızlık yaratacağını söylüyor.
