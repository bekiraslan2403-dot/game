    mekan: Cumhurbaşkanlığı · Kabul salonu
    amac: Yayın yaptırımları ve kamu ilanları hakkında kayıtlı yanıt istiyor.
    sesler:
      - kim: ziyaret_gazeteci
        metin: Üç yerel gazeteyle konuştum. Biri matbaa borcunu ödeyemediği için çıkmıyor. İlan alamadıklarını söylüyorlar. Size
          soru gönderdik, cevap gelmedi. Şimdi kayıttayız; cevabınızı kesmeden yayımlayacağım.
      - kim: ozel_kalem
        metin: Yayın denetimini gevşetmek kanun gerektirir. Yerel haberciliğe açık bir destek de konuşulabilir; bunun bir olumlu
          haber satın alma anlaşmasına dönüşmemesi gerekir.
    belgeler:
      - ad: Heyetin dosyası
        metin: Gazetecinin getirdiği yaptırım kararları kamuya açık. İlan dağıtımındaki dışlanma iddiası için bütün kuruluşların
          karşılaştırmalı hesabı bulunmuyor.
    secenekNotlari:
      - gerekce: Basın üzerindeki yasal müdahaleyi azaltmayı önerirsin.
        bedel: Partinin medya denetimini isteyen kanadı karşı çıkar; Meclis sonucu belirsizdir.
      - gerekce: Kalıcı düzenleme yerine dar kapsamlı bir destek taahhüt edersin.
        bedel: Henüz ödeme yapılmaz. Vadesinde ödenek çıkarılmazsa söz bozulur.
      - gerekce: Yeni taahhüt vermeden mevcut politikayı sürdürürsün.
        bedel: Heyet kararı kamuoyuna taşıyabilir; ilgili grubun tepkisi artar.
  secenekler:
    - metin: Yayın denetimini hafifleten kanun teklifini sun
      etki: {}
      politika: &a7
        id: medya_denetim
        hedef: 1
        yon: azalt
      sonraki:
        - kart: takip_gazeteci
          gecikme: 1
      tepkiler:
        - kim: ziyaret_gazeteci
          metin: Teklifin metnini haberime ekleyeceğim. Yayın denetimi hafiflemiş gibi yazmam için teklif verilmesi yetmez;
            oylamanın da peşinde olacağım.
    - metin: Bağımsız yerel habercilik fonu için söz ver
      etki: {}
      ekonomi:
        soz:
          metin: Açık başvurulu yerel habercilik fonu
          kalem: sosyal
          maliyet: 0.006
          vade: 2
          tek_seferlik: true
          grup: grup.kentli
      sonraki:
        - kart: takip_gazeteci
          gecikme: 1
      tepkiler:
        - kim: ziyaret_gazeteci
          metin: Fonun parasını alacak kuruluşu habere göre seçerseniz bunu da haber yaparım. Sorularımın cevabı fon değil.
    - metin: Yayın denetimini ve ilan düzenini değiştirme
      etki:
        grup.kentli: -2.5
      sonraki:
        - kart: takip_gazeteci
          gecikme: 1
      tepkiler:
        - kim: ziyaret_gazeteci
          metin: Yanıtınızı olduğu gibi yayımlayacağım. Röportaj vermiş olmanız düzeni değiştirdiğiniz anlamına gelmiyor.
