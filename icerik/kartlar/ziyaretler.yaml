      etki: {}
      politika:
        id: okul_yemek
        hedef: 1
        yon: artir
      tepkiler:
        - kim: sendika
          metin: Son kararı ve uygulamada neyin değiştiğini izlemeye devam edeceğiz. Bu görüşme, itirazlarımızdan vazgeçtiğimiz
            anlamına gelmiyor.
    - metin: Dar kapsamlı desteğin ödeneğini şimdi çıkar
      etki: {}
      destek:
        kaynak: kabul_sendika
      tepkiler:
        - kim: sendika
          metin: Bu kaynağın hangi ihtiyaç için ayrıldığını açıkça anlatacağız. Daha geniş talebimizin karşılandığını
