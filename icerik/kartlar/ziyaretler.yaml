    durum: Hüseyin Karaca görüşmeye tören davetini değil, hastane sevklerini getiriyor. Rehabilitasyon için şehir değiştiren
      aileler ulaşım ve konaklama giderini karşılayamıyor. Sağlık Bakanı kapasite artışının bütün hastalara uygulanması
      gerektiğini söylüyor. Dernek, görünür saygının gündelik erişimin yerini tutmadığını anlatıyor.
