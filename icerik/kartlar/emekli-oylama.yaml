# Aralık oylamasından sonra çekirdek, Ocak masasına yalnız bir sonuç dosyası yollar.
- id: emekli_oylama_bordro
  kategori: ekonomi
  tur: acil
  getiren: calisma
  metin:
    baslik: Banka mesajı gelmedi
    durum: Meclis artışı kabul etti. Ocak ödeme listesinin provasında Meral Özden, Naciye Hanım’ın birikmiş fark satırının boş olduğunu görüyor. Emre Kılınç, eski ve yeni banka listelerinin tek dosyada birleştirildiğini söylüyor. Bankaya gönderim bu akşam. Naciye’nin reçetesi bugün eczanede.
  secenekler:
    - metin: İtirazlı bordroları gönderimden önce tek tek denetlet
      icra: { gun: 1 }
      etki: { grup.emekli: 1.2, kamu_hizmet: -0.4 }
      haber: Bakanlık personeli itirazlı kayıtları kontrol etmek için diğer işlemleri erteledi. Düzenli aylıklar mevcut takviminde.
    - metin: Doğrulanan reçeteler için bir defalık kaynak ayır
      icra:
        imza: true
        odeme: { metin: 'Emekli bordrosu: belgeli reçete desteği', kalem: sosyal, maliyet: 0.012, vade: 1, tek_seferlik: true }
      etki: { grup.emekli: 1.6, guven: -0.4 }
      haber: Belgeli reçeteler için ayrı sosyal destek ödeneği açıldı. İtirazlı bordrolar normal inceleme sırasında kaldı.
    - metin: Banka takvimini koru, itirazları normal sırada bırak
      etki: { grup.emekli: -1.4, guven: 0.3 }
      haber: Banka dosyası planlanan saatte gönderildi. Meral, kaydı uyuşmayan üyelerin fark için başvuru sırası bekleyeceğini duyurdu.

- id: emekli_oylama_nobet
  kategori: ekonomi
  tur: acil
  getiren: ziyaret_emekli
  metin:
    baslik: Eczane defteri açık kaldı
    durum: Teklif reddedildi, aylıklar eski kademede kaldı. Meral Özden, Naciye Hanım’ın reçetesini getiriyor. Eczacı bir ay veresiye yazmış. Parti grubu yeniden oylamadan söz ediyor ama takvimde yeni teklif yok. Meral’in dernek toplantısı bu akşam.
  secenekler:
    - metin: Belgeli reçetelere tek seferlik destek ayır
      icra:
        imza: true
        odeme: { metin: 'Emekli teklifi reddi: belgeli reçete desteği', kalem: sosyal, maliyet: 0.012, vade: 1, tek_seferlik: true }
      etki: { grup.emekli: 1.3, guven: -0.4 }
      haber: Belgeli reçeteler için sosyal destek ödeneği açıldı. Meclisin reddettiği aylık düzenlemesi yürürlüğe girmedi.
    - metin: Meral’i dinle, oy dağılımını ve maliyet cetvelini açıkla
      icra: { gun: 1 }
      etki: { grup.emekli: 0.4, guven: 0.5, parti_ici: 0.6 }
      haber: Grup grup oy dağılımı ve maliyet cetveli açıklandı. Derneğe yeni oylama veya ödeme tarihi verilmedi.
    - metin: Mevcut aylıklarla devam edeceğini bildir
      etki: { grup.emekli: -2.2, guven: 0.3 }
      haber: Hükümet yeni ödenek açmadı. Meral, açık reçete borçlarını dernek toplantısında okuyacağını söyledi.
