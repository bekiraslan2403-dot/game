# Ayın ana kararları: her ay masada ilk sırada bir tane olur ve ertelenemez.
# Etki birimleri: ekonomi göstergelerinde kendi birimi (puan, TL); grup desteğinde 0–100 ölçeğinde puan.

- id: asgari_ucret
  tekrar: true
  kategori: ekonomi
  tur: ana
  getiren: calisma
  kosul: { takvim_ayi: [12] }
  metin:
    baslik: Asgari ücret masada
    durum: "Asgari ücret tespit komisyonu toplandı. İşçi konfederasyonu yüzde 45 artış istiyor; işveren temsilcileri yüzde 25'in üzerinde bir artışın kayıt dışılığı büyüteceğini söylüyor."
    kulis: "Komisyon toplantısında çay bitti. Sendika bunu da itiraz şerhine yazdı."
  secenekler:
    - metin: "%45 artış ver, sendikanın talebini karşıla"
      etki: { grup.isci: 5, grup.kiraci: 1.5, grup.is_dunyasi: -4, enflasyon: 1.4, issizlik: 0.3, guven: -4 }
      ekonomi: { asgari_artis: 45 }
      haber: "Asgari ücrete yüzde 45 zam: sendika kutlama yaptı, işverenler “istihdam kaybı” uyarısında bulundu."
    - metin: "%32 artış ver, enflasyonun biraz üstünde kal"
      etki: { grup.isci: 1, grup.is_dunyasi: -1, enflasyon: 0.5 }
      ekonomi: { asgari_artis: 32 }
      haber: "Asgari ücret yüzde 32 arttı; iki taraf da memnun olmadığını açıkladı."
    - metin: "%25 artış ver, işverene prim desteği sağla"
      etki: { grup.isci: -4, grup.kiraci: -1.5, grup.is_dunyasi: 2, butce_acigi: 0.2 }
      bayrak: { asgari_dusuk: true }
      ekonomi: { asgari_artis: 25 }
      sonraki: [{ kart: grev_uyarisi, gecikme: 1 }]
      haber: "Asgari ücret yüzde 25 arttı; sendika “sokaktayız” dedi."

- id: dogalgaz_zammi
  tekrar: true
  kategori: ekonomi
  tur: ana
  zincir: kis_tarifesi
  asama: tohum
  getiren: enerji
  kosul: { takvim_ayi: [10, 11, 1, 2] }
  metin:
    baslik: Kış tarifesinin son imzası
    durum: Enerji Bakanı konut gazına yüzde 38 zam istiyor. Zeytinova'da apartman yöneticisi Füsun, geçen ayın borç listesini yollamış. Bakanlık düşük tüketimi koruyan tarife de hazırlamış; ortak sayaçlı binaların hesabı açıkta. Hazine fiyatı dondurabileceğinizi, bunun dağıtım bakımına para ayırmayacağını söylüyor.
  secenekler:
    - metin: Maliyet artışını tarifeye yansıt
      etki: { enflasyon: 0.9, butce_acigi: -0.3, grup.emekli: -3, grup.isci: -2.5, grup.kiraci: -1.5, guven: 2 }
      sonraki: [{ kart: isinma_tahsilat, gecikme: 1 }]
      haber: Konut gazı tarifesi yüzde 38 artırıldı; ilk tahsilat sonucu gelecek ay masaya gelecek.
    - metin: Düşük tüketimi koru; yüksek tüketime zam uygula
      etki: { enflasyon: 0.4, butce_acigi: -0.15, grup.kentli: -2, grup.emekli: 0.5 }
      sonraki: [{ kart: isinma_sayac, gecikme: 1 }]
      haber: Kademeli gaz tarifesi çıktı; ortak sayaçlı binaların itirazı henüz incelenmedi.
    - metin: Tarifeyi dondur; farkı Hazineye yaz
      etki: { butce_acigi: 0.4, guven: -2, grup.emekli: 1.5, grup.isci: 1 }
      sonraki: [{ kart: isinma_bakim, gecikme: 1 }]
      haber: Konut tarifesi donduruldu; dağıtım bakımı için ayrı ödenek çıkarılmadı.
  anlati:
    mekan: Cumhurbaşkanlığı · kış tarifesi toplantısı
    amac: Fiyat, tahsilat ve bakımın bedelini kimin üstleneceğini belirle.
    sesler:
      - { kim: enerji, metin: 'Gazın alış fiyatıyla faturanın arasını birinin kapatması gerekiyor. Bu gece tarifeyi imzalarsak ilk hesap gelecek ay gelecek.' }
      - { kim: fusun_ergin, metin: 'Binada altı daire var, bir sayaç. Bu kış yardım çıkacaksa kimin adına başvuracağımızı şimdiden söyleyin.' }
    belgeler:
      - { ad: Üç tarife, metin: 'Tam zam maliyeti hanelere taşır. Kademeli tarifede örnek hanenin gaz artışı yüzde 12 kabul edilir; ortak sayaç itirazı ayrıca incelenir. Dondurma fiyat farkını Hazineye bırakır. Bakım bu hesapta ayrı iştir.' }
    secenekNotlari:
      - { gerekce: Fiyat farkını faturaya geçirirsin., bedel: Ödeyemeyen haneler ve ortak sayaçlı binalar kesme riskiyle döner. }
      - { gerekce: Düşük tüketimli haneyi korursun., bedel: Tek abone görünen apartman yüksek kademeye takılabilir. }
      - { gerekce: Konut tarifesini sabit tutarsın., bedel: Hazine yükü büyür; dağıtım arızası bu kaynakla onarılmaz. }

- id: faiz_karari
  tekrar: true
  kategori: ekonomi
  tur: ana
  getiren: merkez_bankasi
  metin:
    baslik: Merkez Bankası faiz kararı öncesi
    durum: "Merkez Bankası Başkanı, Para Politikası Kurulu toplantısından önce sizi aradı. Enflasyon beklentileri bozulmuş; kurul faizi artırmayı tartışıyor. Parti içinden faizin düşürülmesi için baskı var."
    kulis: "Başkan telefonu kapatmadan önce “Ben size haber verdim, siz de bana haber verin” dedi."
  secenekler:
    - metin: Bankanın kararına karışma
      etki: { faiz: 2, enflasyon: -0.6, buyume: -0.3, guven: 4, grup.esnaf: -1.5, parti_ici: 3 }
      haber: "Merkez Bankası faizi 2 puan artırdı; piyasalar kararı olumlu karşıladı."
    - metin: Faizi sabit tutması için baskı yap
      etki: { enflasyon: 0.4, guven: -3, kur: 1.5 }
      haber: "Merkez Bankası faizi sabit bıraktı; ekonomistler bağımsızlık konusunda soru işaretleri dile getirdi."
    - metin: Faizi indirmesini iste, gerekirse başkanı değiştir
      etki: { faiz: -2, enflasyon: 1.2, buyume: 0.4, guven: -8, kur: 4, grup.esnaf: 2, rezerv: -6 }
      sicil: { tur: baski, kaynak: "Merkez Bankası'na faiz indirimi baskısı" }
      haber: "Merkez Bankası beklenmedik biçimde faizi 2 puan indirdi; dolar kuru sert yükseldi."

- id: kira_tavani
  kategori: toplum
  tur: ana
  getiren: cevre
  metin:
    baslik: Kira artış sınırı sona eriyor
    durum: "Kira artışlarına getirilen yüzde 25 sınır bu ay sona eriyor. Kiracı dernekleri uzatılmasını, mülk sahipleri kaldırılmasını istiyor. Bazı ev sahipleri sınırı aşmak için kiracılarını çıkarmaya çalışıyor."
  secenekler:
    - metin: Sınırı bir yıl daha uzat
      etki: { grup.kiraci: 3.5, grup.kentli: 1, grup.esnaf: -1.5, guven: -1.5 }
      haber: "Kira artış sınırı bir yıl uzatıldı; ilanlardaki kiralık daire sayısı düştü."
    - metin: Sınırı kaldır, piyasaya bırak
      etki: { grup.kiraci: -5, grup.kentli: -2, guven: 2, enflasyon: 0.3 }
      haber: "Kira artış sınırı kalktı; büyükşehirlerde yeni kira sözleşmeleri yüzde 60'a varan artışla yapılıyor."
    - metin: Artışı enflasyona bağla, tahliye davalarına süre şartı getir
      etki: { grup.kiraci: 1.5, grup.esnaf: -0.5 }
      haber: "Kira artışları on iki aylık enflasyon ortalamasına bağlandı."

- id: bayram_ikramiyesi
  tekrar: true
  kategori: ekonomi
  tur: ana
  getiren: calisma
  kalem: emekli
  kosul: { takvim_ayi: [3, 4] }
  metin:
    baslik: Emeklilere bayram ikramiyesi
    durum: "Ramazan Bayramı yaklaşıyor. Emekli dernekleri ikramiyenin asgari ücretin yarısına çıkarılmasını istiyor; Hazine bunun bir aylık sağlık harcamasına denk geldiğini hesapladı."
    kulis: "Hazine Bakanı hesabı üç kez yaptı, üçünde de aynı sonuç çıktı. Bu kez kendisi de şaşırdı."
  secenekler:
    - metin: İkramiyeyi asgari ücretin yarısına çıkar
      etki: { grup.emekli: 5, butce_acigi: 0.35, enflasyon: 0.2 }
      haber: "Emekli bayram ikramiyesi iki katına çıktı."
    - metin: Enflasyon oranında artır
      etki: { grup.emekli: 0.5, butce_acigi: 0.1 }
      haber: "Bayram ikramiyesi enflasyon oranında artırıldı."
    - metin: Bu yıl artırma; bütçe disiplinini öne çıkar
      etki: { grup.emekli: -4, guven: 1.5 }
      haber: "Bayram ikramiyesi artırılmadı; emekliler “bayram değil seyran” dedi."

- id: akaryakit_otv
  tekrar: true
  kategori: ekonomi
  tur: ana
  getiren: hazine
  kalem: akaryakit
  metin:
    baslik: Akaryakıtta ÖTV kararı
    durum: "Petrol fiyatı bir ayda yüzde 18 arttı. Benzinin litresi 60 lirayı geçmek üzere. Hazine, ÖTV indiriminin aylık 20 milyar liralık gelir kaybı demek olduğunu hatırlatıyor."
  secenekler:
    - metin: Artışı pompaya yansıt
      etki: { enflasyon: 0.7, grup.esnaf: -2, grup.isci: -1.5, grup.kentli: -1.5, butce_acigi: -0.05 }
      haber: "Benzin 60 lirayı aştı; taksiciler kontak kapattı."
    - metin: ÖTV'yi düşür, artışı vergiyle karşıla
      etki: { butce_acigi: 0.3, grup.esnaf: 1.5, grup.isci: 1 }
      haber: "Akaryakıtta ÖTV indirimi: pompa fiyatı değişmedi."
    - metin: Eşel mobil sistemini geri getir
      etki: { butce_acigi: 0.15, enflasyon: 0.3, grup.esnaf: 0.5 }
      haber: "Eşel mobil yeniden yürürlükte; zammın yarısı vergiden karşılanacak."

- id: deprem_konut
  kategori: toplum
  tur: ana
  getiren: cevre
  kalem: yatirim
  metin:
    baslik: Konteyner kentlerde ikinci kış
    durum: "Deprem bölgesinde 140 bin kişi ikinci kışına konteynerde giriyor. Kalıcı konutların ancak üçte biri tamamlandı. Müteahhitler maliyet artışı nedeniyle ek ödeme istiyor."
  secenekler:
    - metin: Müteahhitlere ek ödeme yap, teslimi hızlandır
      etki: { butce_acigi: 0.3, grup.kentli: 1, grup.muhafazakar: 1, enflasyon: 0.1 }
      bayrak: { deprem_hizlandi: true }
      haber: "Deprem konutlarında ek ödeme kararı: teslimatlar dört ay öne çekildi."
    - metin: Sözleşmeleri fesih tehdidiyle zorla
      etki: { grup.is_dunyasi: -2, guven: -1, grup.kentli: 0.5 }
      haber: "Hükümet geciken müteahhitlere fesih uyarısı yaptı."
    - metin: Konteynerleri ısıt, konutları programında bırak
      etki: { butce_acigi: 0.05, grup.kentli: -1.5, kutuplasma: 2 }
      haber: "Konteyner kentlere ısıtıcı dağıtıldı; depremzedeler “ısıtıcı değil ev istiyoruz” dedi."

- id: yillik_butce
  tekrar: true
  kategori: ekonomi
  tur: ana
  zincir: butce_yili
  asama: tohum
  getiren: ekonomi_danismani
  kosul: { takvim_ayi: [10] }
  kalem: yatirim
  metin:
    baslik: Yıllık bütçe Meclis yolunda
    durum: Hazine yeni yılın cetvelini hazırladı. Derya’nın çalıştığı ilçede hastane servisleri eski araçlarla dönüyor. Hazine Bakanı, yatırım ödeneği artarsa açığın da büyüyeceğini söylüyor. Taslağı bugün seçiyorsun. Kasım’da komisyon, Aralık’ta Genel Kurul önüne gelecek.
  secenekler:
    - metin: Yatırımları artıran bütçeyi sun
      etki: { butce_acigi: 0.3, buyume: 0.2, grup.kentli: 1.5, guven: -2 }
      sonraki: [{ kart: butce_komisyonu, gecikme: 1 }]
      haber: Yatırım ağırlıklı taslak komisyonda görüşülecek. Yeni harcama için yürürlük bekleniyor.
      tepkiler:
        - kim: hazine
          metin: Cetvele artışı yazdım. İl müdürleri sipariş vermek istiyor ama önümde henüz yürürlükte bir ödenek yok.
    - metin: Açığı azaltan sıkı bütçeyi sun
      etki: { butce_acigi: -0.2, buyume: -0.15, grup.isci: -1.5, guven: 2 }
      sonraki: [{ kart: butce_komisyonu, gecikme: 1 }]
      haber: Hazine, bazı yatırım başlangıçlarını sonraki programa bırakan taslağı komisyona gönderdi.
      tepkiler:
        - kim: sendika
          metin: Bir proje kâğıtta kayınca ekibin çalışacağı yer de kayıyor. Hangi sözleşmelerin erteleneceğini görmek istiyoruz.
    - metin: Sınırlı artışla uzlaşma bütçesi sun
      etki: { butce_acigi: 0.08, grup.kentli: 0.5, grup.emekli: -0.8 }
      sonraki: [{ kart: butce_komisyonu, gecikme: 1 }]
      haber: Sınırlı yatırım artışı içeren taslak komisyona gönderildi.
      tepkiler:
        - kim: hazine
          metin: Artış dar. Komisyon daha fazla iş koymak isterse karşılığını aynı cetvelde göstereceğim.

- id: butce_komisyonu
  kategori: ekonomi
  tur: zincir
  zincir: butce_yili
  asama: sonuc
  getiren: hazine
  metin:
    baslik: Komisyonun önündeki servis anahtarı
    durum: Komisyon masasındaki servis anahtarı çalışmayan bir araca ait. İl hastanesinden Derya, diyaliz hastalarını taşıyan aracın üç kez yolda kaldığını anlatıyor. Bayrak Partisi yatırım listesine ulaşım ödeneği girmesini istiyor. Hazine, ilk cetveli, daraltılmış cetveli ve ek ödenekli cetveli masaya koydu.
  secenekler:
    - metin: Yeni yatırım başlangıçlarını ikinci dilime bırak
      etki: { grup.isci: -0.6 }
      haber: İlk dilimin yatırım ödeneği millî gelire oranla 0,10 puan azaltıldı. Taslak oylama bekliyor.
      tepkiler:
        - kim: hazine
          metin: Ertelediğimiz işleri ayrı sıraya yazdım. Kesintiyi kabul ederse Meclis, sonraki yatırımlar için tekrar ödenek arayacağız.
    - metin: Ulaşım ödeneğini ekle, Bayrak grubuyla uzlaş
      etki: { parti_ici: 0.8 }
      haber: Taslağa millî gelirin yüzde 0,06’sı kadar yatırım ödeneği eklendi. Bayrak grubunun oylama desteği arttı.
      tepkiler:
        - kim: hazine
          metin: Bu satır taslakta. Derya’ya satın alma tarihi vermeyelim. Önce Genel Kurul, sonra bütçenin yürürlüğe girmesi var.
    - metin: İlk taslağı olduğu gibi Genel Kurula gönder
      etki: { grup.kentli: -0.4 }
      haber: Komisyon taslak ödeneklerini değiştirmedi. Ek grup desteği anlaşması yapılmadı.
      tepkiler:
        - kim: hazine
          metin: İlk cetveli mühürledim. Servis listesi komisyon tutanağına girdi. Oylamadan sonra hangi işin ödeneği var, belli olacak.
