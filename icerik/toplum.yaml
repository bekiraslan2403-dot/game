# Gazeteler, kapıda bekleyenler ve sokak eylemleri (Sistem 4 ve 5). Kurum ve kişiler kurgusaldır.

gazeteler:
  - id: yandas
    ad: Doruk Sabah
    olumlu: ["TARİHÎ ADIM", "SÖZ VERDİ, YAPTI", "MİLLETİN SESİ DUYULDU", "YENİ BİR DÖNEM BAŞLIYOR"]
    olumsuz: ["KARARLI DURUŞ", "PROVOKASYONA GEÇİT YOK", "DEVLET DİMDİK AYAKTA", "OYUNU BOZDUK"]
  - id: muhalif
    ad: Halkın Sesi
    olumlu: ["SEÇİM YATIRIMI", "GEÇ KALMIŞ ADIM", "GÖZ BOYAMA", "YİNE SON DAKİKA KARARI"]
    olumsuz: ["FATURA YİNE VATANDAŞA", "HALK BEDEL ÖDÜYOR", "SKANDAL", "ÖFKE BÜYÜYOR"]
  - id: ekonomi
    ad: Finans Gündem
    olumlu: ["Piyasalar karara olumlu baktı", "Yatırımcı ihtiyatlı iyimser"]
    olumsuz: ["Piyasalarda temkin", "Yatırımcı belirsizlikten tedirgin"]

# Her ay üç ziyaretçi kapıda bekler; kabul etmek takvimden bir gün alır. Kabul edilmeyenler ay sonunda küser.
ziyaretciler:
  - { id: sendika, kim: İşçi konfederasyonu başkanı, konu: asgari ücret görüşmesi istiyor, kabul: { grup.isci: 1.5 }, ihmal: { grup.isci: -1 } }
  - { id: isveren, kim: İş dünyası heyeti, konu: yatırım ortamını konuşmak istiyor, kabul: { grup.is_dunyasi: 1.5, guven: 1 }, ihmal: { grup.is_dunyasi: -0.8 } }
  - { id: emekli, kim: Emekli dernekleri, konu: bayram ikramiyesi için randevu bekliyor, kabul: { grup.emekli: 1.4 }, ihmal: { grup.emekli: -1 } }
  - { id: sehit, kim: Şehit aileleri derneği, konu: terörle mücadele politikasını konuşmak istiyor, kabul: { grup.milliyetci: 1.5 }, ihmal: { grup.milliyetci: -1.2 } }
  - { id: deprem, kim: Depremzede dernekleri, konu: kalıcı konut takvimini soruyor, kabul: { grup.kiraci: 1, deprem: 0.5 }, ihmal: { grup.kiraci: -0.8 } }
  - { id: ogrenci, kim: Üniversite öğrenci temsilcileri, konu: yurt ve barınma sorununu anlatmak istiyor, kabul: { grup.genc: 1.5 }, ihmal: { grup.genc: -1 } }
  - { id: kadin, kim: Kadın örgütleri platformu, konu: kadına şiddet yasası için görüşme istiyor, kabul: { grup.kentli: 1, grup.laik: 0.5 }, ihmal: { grup.kentli: -0.6 } }
  - { id: ciftci, kim: Ziraat odaları birliği, konu: gübre ve mazot desteğini konuşmak istiyor, kabul: { grup.esnaf: 1.5 }, ihmal: { grup.esnaf: -1 } }
  - { id: gazeteci, kim: Bağımsız bir gazeteci, konu: uzun bir röportaj istiyor, kabul: { grup.kentli: 1, grup.laik: 0.8, basin: 1 }, ihmal: {} }
  - { id: buyukelci, kim: Avrupa Birliği büyükelçisi, konu: ilerleme raporu öncesi görüşme talep ediyor, kabul: { itibar: 1.5 }, ihmal: { itibar: -0.8 } }
  - { id: vakif, kim: Muhafazakâr vakıflar platformu, konu: aile ve eğitim politikalarını konuşmak istiyor, kabul: { grup.muhafazakar: 1.5 }, ihmal: { grup.muhafazakar: -1 } }
  - { id: kalan, kim: Kalan kanaat önderleri, konu: kayyum uygulamasını konuşmak istiyor, kabul: { grup.kalan: 2, grup.milliyetci: -0.5 }, ihmal: { grup.kalan: -1.2 } }
  - { id: memur, kim: Memur sendikaları, konu: toplu sözleşme takvimini soruyor, kabul: { grup.memur: 1.5 }, ihmal: { grup.memur: -1 } }
  - { id: kiraci, kim: Kiracılar derneği, konu: tahliye davalarını anlatmak istiyor, kabul: { grup.kiraci: 1.5 }, ihmal: { grup.kiraci: -1 } }
  - { id: il_baskani, kim: Partinin il başkanları, konu: seçim hazırlığını konuşmak istiyor, kabul: { parti_ici: -2 }, ihmal: { parti_ici: 1.5 } }

