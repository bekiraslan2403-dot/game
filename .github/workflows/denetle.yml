name: Denetle
on:
  push:
  pull_request:
jobs:
  denetle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run denetle
      - uses: actions/upload-artifact@v4
        with:
          name: akkopru-oyun
          path: dist/index.html
